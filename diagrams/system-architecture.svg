<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="720" viewBox="0 0 1000 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ShiftRelay System Architecture</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <rect width="1000" height="720" fill="#F8FAFC"/>
  
  <!-- Diagram Title -->
  <rect x="30" y="30" width="940" height="70" rx="10" fill="#0F172A"/>
  <text x="50" y="72" fill="#FFFFFF" font-size="22" font-weight="800" class="font-sans">ShiftRelay — System Architecture &amp; Data Isolation</text>

  <!-- Browser Shell -->
  <rect x="30" y="120" width="940" height="560" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="50" y="150" fill="#2563EB" font-size="13" font-weight="700" class="font-mono">CLIENT RUNTIME LAYER (No External Frameworks / Vanilla ES-Modules)</text>

  <!-- Router Box -->
  <rect x="50" y="170" width="900" height="70" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="70" y="200" fill="#1E40AF" font-size="15" font-weight="700" class="font-sans">Client-Side History API Router (js/app.js)</text>
  <text x="70" y="224" fill="#3B82F6" font-size="12" class="font-mono">URL Normalization • Regex Route Table • pushState / popstate • Hash-Routing Fallback</text>

  <!-- Views Layer -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="280" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="20" y="32" fill="#0F172A" font-size="14" font-weight="700" class="font-sans">Public Landing Page</text>
    <text x="20" y="55" fill="#64748B" font-size="12" class="font-body">Hero split-view, 5-stage flow,</text>
    <text x="20" y="75" fill="#64748B" font-size="12" class="font-body">problem vs solution matrix</text>
    <text x="20" y="95" fill="#2563EB" font-size="11" font-weight="600" class="font-mono">landing-view.js</text>

    <rect x="310" y="0" width="280" height="110" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="330" y="32" fill="#D97706" font-size="14" font-weight="700" class="font-sans">Interactive Demo (/demo)</text>
    <text x="330" y="55" fill="#92400E" font-size="12" class="font-body">5-Milestone Guided Sandbox</text>
    <text x="330" y="75" fill="#92400E" font-size="12" class="font-body">Real-time conflict injection</text>
    <text x="330" y="95" fill="#D97706" font-size="11" font-weight="600" class="font-mono">demo-view.js</text>

    <rect x="620" y="0" width="280" height="110" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="640" y="32" fill="#0F172A" font-size="14" font-weight="700" class="font-sans">Workspace Modules (/app/*)</text>
    <text x="640" y="55" fill="#64748B" font-size="12" class="font-body">Dashboard, Shifts, Handovers,</text>
    <text x="640" y="75" fill="#64748B" font-size="12" class="font-body">Tasks, Incidents, Activity, Search</text>
    <text x="640" y="95" fill="#2563EB" font-size="11" font-weight="600" class="font-mono">views.js</text>
  </g>

  <!-- State & Logic Layer -->
  <g transform="translate(50, 395)">
    <!-- Isolated Demo Store -->
    <rect x="0" y="0" width="435" height="135" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="20" y="30" fill="#D97706" font-size="14" font-weight="700" class="font-sans">In-Memory Demo Sandbox State</text>
    <text x="20" y="55" fill="#92400E" font-size="12" class="font-body">Completely isolated JavaScript memory heap.</text>
    <text x="20" y="75" fill="#92400E" font-size="12" class="font-body">Interactions NEVER touch or alter LocalStorage.</text>
    <rect x="20" y="92" width="210" height="24" rx="4" fill="#FEF3C7"/>
    <text x="28" y="108" fill="#B45309" font-size="11" font-weight="700" class="font-mono">0 LocalStorage Pollution</text>

    <!-- Production Store & Engine -->
    <rect x="465" y="0" width="435" height="135" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="485" y="30" fill="#1E40AF" font-size="14" font-weight="700" class="font-sans">Production Store &amp; Continuity Engine</text>
    <text x="485" y="55" fill="#1E3A8A" font-size="12" class="font-body">Shift overlap validation, state transitions, closedShift,</text>
    <text x="485" y="75" fill="#1E3A8A" font-size="12" class="font-body">conflict detection, mandatory resolution notes.</text>
    <rect x="485" y="92" width="280" height="24" rx="4" fill="#DBEAFE"/>
    <text x="495" y="108" fill="#1D4ED8" font-size="11" font-weight="700" class="font-mono">js/store.js • Deterministic State Machine</text>
  </g>

  <!-- Persistence Layer -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="900" height="95" rx="8" fill="#0F172A"/>
    <text x="30" y="35" fill="#FFFFFF" font-size="15" font-weight="700" class="font-sans">Browser LocalStorage Persistence Layer</text>
    <text x="30" y="60" fill="#94A3B8" font-size="13" class="font-body">Primary Storage Key: <tspan fill="#38BDF8" font-family="JetBrains Mono">shiftrelay.v1</tspan> • Automatic Migration from Legacy Key: <tspan fill="#F59E0B" font-family="JetBrains Mono">handoverhq.v1</tspan></text>
    <text x="30" y="80" fill="#34D399" font-size="12" class="font-mono">Defensive Schema Validation • Quota Error Trapping • Clean Reset Baseline</text>
  </g>

</svg>