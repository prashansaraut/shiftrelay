<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ShiftRelay Data Relationships ER Diagram</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <rect width="1000" height="700" fill="#F8FAFC"/>
  
  <!-- Diagram Header -->
  <rect x="30" y="30" width="940" height="70" rx="10" fill="#0F172A"/>
  <text x="50" y="72" fill="#FFFFFF" font-size="22" font-weight="800" class="font-sans">ShiftRelay — Entity-Relationship &amp; Data Schema Model</text>

  <!-- ER Entities Grid -->
  <g transform="translate(50, 130)">
    <!-- Shift Entity -->
    <rect x="0" y="0" width="260" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="0" y="0" width="260" height="34" rx="8" fill="#0F172A"/>
    <text x="15" y="23" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">SHIFT (Core Rotation)</text>
    <g transform="translate(15, 50)" fill="#334155" font-size="11" class="font-mono">
      <text x="0" y="15" font-weight="700">id: string [PK] (e.g. SH-MORN)</text>
      <text x="0" y="35">name: string</text>
      <text x="0" y="55">dept: string</text>
      <text x="0" y="75">start: time (06:00)</text>
      <text x="0" y="95">end: time (14:00)</text>
      <text x="0" y="115">status: 'Active'|'Upcoming'</text>
      <text x="0" y="135">staff: string[] [FK ➔ EMPLOYEE]</text>
    </g>

    <!-- Handover Entity -->
    <rect x="320" y="0" width="280" height="250" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <rect x="320" y="0" width="280" height="34" rx="8" fill="#2563EB"/>
    <text x="335" y="23" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">HANDOVER (Custody Transfer)</text>
    <g transform="translate(335, 50)" fill="#1E3A8A" font-size="11" class="font-mono">
      <text x="0" y="15" font-weight="700">id: string [PK] (HO-8241)</text>
      <text x="0" y="35">fromShift: string [FK ➔ SHIFT]</text>
      <text x="0" y="55">toShift: string [FK ➔ SHIFT]</text>
      <text x="0" y="75">outgoing: string (Employee)</text>
      <text x="0" y="95">incoming: string (Employee)</text>
      <text x="0" y="115">status: 'Draft'|'Submitted'|...</text>
      <text x="0" y="135">taskIds: string[] [FK ➔ TASK]</text>
      <text x="0" y="155">incidentIds: string[] [FK]</text>
      <text x="0" y="175">ackBy: string | null</text>
      <text x="0" y="195">ackAt: ISOString | null</text>
    </g>

    <!-- Employee Entity -->
    <rect x="650" y="0" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="650" y="0" width="250" height="34" rx="8" fill="#0F172A"/>
    <text x="665" y="23" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">EMPLOYEE</text>
    <g transform="translate(665, 50)" fill="#334155" font-size="11" class="font-mono">
      <text x="0" y="15" font-weight="700">id: string [PK] (E1..E5)</text>
      <text x="0" y="35">name: string</text>
      <text x="0" y="55">role: 'Manager'|'Staff'...</text>
    </g>

    <!-- Task Entity -->
    <rect x="0" y="240" width="280" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="0" y="240" width="280" height="34" rx="8" fill="#0F172A"/>
    <text x="15" y="263" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">TASK</text>
    <g transform="translate(15, 290)" fill="#334155" font-size="11" class="font-mono">
      <text x="0" y="15" font-weight="700">id: string [PK] (TK-1001)</text>
      <text x="0" y="35">title: string</text>
      <text x="0" y="55">cat: string</text>
      <text x="0" y="75">priority: 'Low'|'Med'|'High'|'Crit'</text>
      <text x="0" y="95">assignee: string</text>
      <text x="0" y="115">shiftId: string [FK ➔ SHIFT]</text>
      <text x="0" y="135">status: 'Pending'|'Carried Forward'</text>
      <text x="0" y="155">carry: number (cumulative)</text>
      <text x="0" y="175">closedShift: string | null [FK]</text>
      <text x="0" y="195">history: { at, by, text }[]</text>
    </g>

    <!-- Incident Entity -->
    <rect x="320" y="280" width="280" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="320" y="280" width="280" height="34" rx="8" fill="#DC2626"/>
    <text x="335" y="303" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">INCIDENT</text>
    <g transform="translate(335, 330)" fill="#334155" font-size="11" class="font-mono">
      <text x="0" y="15" font-weight="700">id: string [PK] (IN-2001)</text>
      <text x="0" y="35">title: string</text>
      <text x="0" y="55">category: string</text>
      <text x="0" y="75">severity: 'Low'|'Med'|'High'|'Crit'</text>
      <text x="0" y="95">reportedBy: string</text>
      <text x="0" y="115">shiftId: string [FK ➔ SHIFT]</text>
      <text x="0" y="135">status: 'Reported'|'Resolved'|'Closed'</text>
      <text x="0" y="155">resolution: string (mandatory)</text>
      <text x="0" y="175">carry: number (cumulative)</text>
      <text x="0" y="195">closedShift: string | null [FK]</text>
    </g>

    <!-- Activity Entity -->
    <rect x="650" y="200" width="250" height="170" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="650" y="200" width="250" height="34" rx="8" fill="#0F172A"/>
    <text x="665" y="223" fill="#FFFFFF" font-size="13" font-weight="700" class="font-sans">ACTIVITY (Audit Stream)</text>
    <g transform="translate(665, 250)" fill="#334155" font-size="11" class="font-mono">
      <text x="0" y="15" font-weight="700">id: string [PK] (AC-xxx)</text>
      <text x="0" y="35">at: ISOString</text>
      <text x="0" y="55">text: string</text>
      <text x="0" y="75">ref: string [FK ➔ Entity ID]</text>
      <text x="0" y="95">user: string</text>
    </g>
  </g>

</svg>