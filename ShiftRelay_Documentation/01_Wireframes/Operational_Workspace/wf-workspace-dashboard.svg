<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="960" fill="#F8FAFC" />

  <!-- Sidebar (Left Fixed 240px) -->
  <rect x="0" y="0" width="240" height="960" fill="#0F172A" />
  
  <!-- Sidebar Brand -->
  <g transform="translate(20, 20)">
    <circle cx="16" cy="16" r="14" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5" />
    <rect x="13" y="9" width="6" height="14" rx="3" transform="rotate(25 16 16)" fill="#60A5FA" />
    <text x="40" y="21" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">ShiftRelay</text>
    <text x="40" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Operational Workspace</text>
  </g>

  <!-- Navigation Menu Items -->
  <g transform="translate(15, 80)">
    <!-- Active Route: Dashboard -->
    <rect x="0" y="0" width="210" height="40" rx="6" fill="#1E293B" />
    <rect x="15" y="14" width="12" height="12" rx="2" fill="#60A5FA" />
    <text x="38" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Dashboard</text>

    <!-- Shifts -->
    <text x="38" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Shifts</text>

    <!-- Handovers -->
    <text x="38" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Handovers</text>

    <!-- Tasks -->
    <text x="38" y="160" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Tasks</text>

    <!-- Incidents -->
    <text x="38" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Incidents</text>

    <!-- Activity -->
    <text x="38" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Activity</text>

    <!-- Settings -->
    <text x="38" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Settings</text>
  </g>

  <!-- Sidebar Footer Notice -->
  <g transform="translate(15, 880)">
    <rect width="210" height="60" rx="6" fill="#1E293B" stroke="#334155" />
    <text x="12" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Continuity Mode: ON</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Original ID Preservation Active</text>
  </g>

  <!-- Main Content Area (width: calc(100% - 240px)) -->
  <g transform="translate(240, 0)">
    <!-- Workspace Topbar -->
    <rect x="0" y="0" width="1200" height="64" fill="#FFFFFF" stroke="#E2E8F0" />
    
    <!-- Left: Global Search -->
    <rect x="30" y="14" width="360" height="36" rx="18" fill="#F8FAFC" stroke="#CBD5E1" />
    <circle cx="48" cy="32" r="5" stroke="#94A3B8" stroke-width="1.2" fill="none" />
    <line x1="52" y1="36" x2="56" y2="40" stroke="#94A3B8" stroke-width="1.2" />
    <text x="65" y="37" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Search across shifts, tasks, handovers...</text>

    <!-- Right: Theme Toggle, Quick Demo, Profile Menu -->
    <g transform="translate(760, 14)">
      <!-- Demo Quick Link -->
      <rect x="0" y="0" width="95" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
      <polygon points="15,13 21,18 15,23" fill="#0F172A" />
      <text x="28" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Demo</text>

      <!-- Theme Toggle -->
      <rect x="110" y="0" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
      <path d="M128 11 C132 11 135 14 135 18 C135 22 132 25 128 25 C130 23 131 20 131 18 C131 16 130 13 128 11 Z" fill="#0F172A" />

      <!-- Profile Avatar & Trigger -->
      <g transform="translate(160, 0)">
        <rect width="250" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
        <circle cx="20" cy="18" r="12" fill="#0F172A" />
        <text x="13" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">PN</text>
        <text x="40" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Priya Nair</text>
        <text x="40" y="29" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Operations Manager (Demo)</text>
        <path d="M230 16 L235 21 L240 16" fill="none" stroke="#64748B" stroke-width="1.5" />
      </g>
    </g>

    <!-- Dashboard Content Canvas -->
    <g transform="translate(35, 90)">
      <!-- Page Header -->
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Operations Dashboard</text>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Real-time facility custody status, carried-forward task monitors, and rollover anomaly metrics.</text>

      <!-- Key Metrics Row (4 Columns) -->
      <g transform="translate(0, 65)">
        <rect x="0" y="0" width="265" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Carried-Forward Items</text>
        <text x="20" y="70" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#0F172A">4</text>
        <text x="20" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#16A34A">Preserved across handovers</text>

        <rect x="285" y="0" width="265" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="305" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Repeat Rollover Risk</text>
        <text x="305" y="70" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#0F172A">1</text>
        <text x="305" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#D97706">Items rolled 2+ times</text>

        <rect x="570" y="0" width="265" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="590" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Open Incidents</text>
        <text x="590" y="70" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#0F172A">2</text>
        <text x="590" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#DC2626">Requires resolution notes</text>

        <rect x="855" y="0" width="265" height="110" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="875" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Active Handover State</text>
        <text x="875" y="65" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A">HO-8241</text>
        <rect x="875" y="75" width="130" height="20" rx="4" fill="#FEF3C7" />
        <text x="885" y="89" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#92400E">Awaiting Acknowledgement</text>
      </g>

      <!-- Data Section Split: Active Custody & Tasks -->
      <g transform="translate(0, 200)">
        <!-- Left: Handover Custody Monitor -->
        <rect x="0" y="0" width="550" height="420" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="25" y="35" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Active Handover Pipeline</text>
        <line x1="25" y1="50" x2="525" y2="50" stroke="#E2E8F0" />
        
        <rect x="25" y="65" width="500" height="85" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
        <text x="40" y="90" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">HO-8241</text>
        <text x="110" y="90" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Morning Shift → Evening Shift</text>
        <text x="40" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Supervisor: Priya Nair | Attached: 4 Tasks, 2 Incidents</text>
        <rect x="40" y="122" width="115" height="18" rx="4" fill="#FEF3C7" />
        <text x="50" y="135" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#92400E">Awaiting Sign-off</text>

        <rect x="25" y="165" width="500" height="85" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="40" y="190" font-family="monospace" font-size="11" font-weight="700" fill="#64748B">HO-8240</text>
        <text x="110" y="190" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Night Shift → Morning Shift</text>
        <text x="40" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Completed at 06:00 • 3 items carried forward</text>
        <rect x="40" y="222" width="85" height="18" rx="4" fill="#E2E8F0" />
        <text x="50" y="235" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#334155">Acknowledged</text>

        <!-- Action Trigger -->
        <rect x="25" y="355" width="500" height="40" rx="6" fill="#0F172A" />
        <text x="195" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Initiate New Handover Protocol</text>
      </g>

      <!-- Right: Priority Tasks & Incidents Registry -->
      <g transform="translate(570, 200)">
        <rect x="0" y="0" width="550" height="420" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="25" y="35" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Priority Tasks &amp; Active Anomalies</text>
        <line x1="25" y1="50" x2="525" y2="50" stroke="#E2E8F0" />

        <g transform="translate(25, 65)">
          <rect width="500" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
          <text x="15" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">TK-8241</text>
          <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Inspect Boiler Feed Pump 2 Pressure</text>
          <rect x="410" y="12" width="75" height="20" rx="10" fill="#E2E8F0" />
          <text x="425" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">High</text>
          <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Origin: SH-01 • Carried x1 • Assigned to Evening Shift</text>
        </g>

        <g transform="translate(25, 140)">
          <rect width="500" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
          <text x="15" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">IN-3012</text>
          <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Cooling Water Line Valve Leakage</text>
          <rect x="410" y="12" width="75" height="20" rx="10" fill="#FEE2E2" />
          <text x="425" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991B1B">Major</text>
          <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Mechanical Isolation in progress • Mandatory Resolution Notes</text>
        </g>

        <g transform="translate(25, 215)">
          <rect width="500" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
          <text x="15" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">TK-8242</text>
          <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Verify Turbine Bearing Oil Temperature</text>
          <rect x="410" y="12" width="75" height="20" rx="10" fill="#E2E8F0" />
          <text x="425" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Medium</text>
          <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Normal reading logged at 13:45</text>
        </g>

        <!-- Action Trigger -->
        <rect x="25" y="355" width="500" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="190" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">View Full Task &amp; Incident Registry</text>
      </g>
    </g>
  </g>
</svg>