<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="1280" height="900" fill="#F8FAFC" />

    <!-- Top Demo Navigation -->
    <rect width="1280" height="64" fill="#FFFFFF" stroke="#E2E8F0" />
    <g transform="translate(40, 18)">
      <circle cx="14" cy="14" r="12" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5" />
      <text x="36" y="19" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">ShiftRelay</text>
      <rect x="135" y="2" width="130" height="24" rx="12" fill="#FEF3C7" />
      <text x="148" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400E">Interactive Sandbox</text>
      
      <!-- Right Action Controls -->
      <g transform="translate(900, 0)">
        <rect x="0" y="0" width="80" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="18" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Reset</text>

        <rect x="90" y="0" width="130" height="30" rx="4" fill="#0F172A" />
        <text x="105" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Open Workspace</text>
      </g>
    </g>

    <!-- Stepper Navigation (5 Milestones) -->
    <g transform="translate(40, 85)">
      <rect width="1200" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      
      <!-- Step 1 -->
      <g transform="translate(20, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">1</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Inspect Queue</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(260, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">2</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Draft Handover</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(500, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">3</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Conflict Simulation</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(740, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">4</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Incoming Sign-Off</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(980, 15)">
        <rect width="200" height="40" rx="6" fill="#0F172A" />
        <circle cx="25" cy="20" r="10" fill="#FFFFFF" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">5</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Continuity Audit</text>
      </g>
    </g>

    <!-- Main Milestone Workspace Canvas -->
    <g transform="translate(40, 180)">
      <!-- Milestone Header Banner -->
      <rect width="1200" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <g transform="translate(30, 25)">
        <rect width="110" height="20" rx="10" fill="#E2E8F0" />
        <text x="15" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">MILESTONE 5 OF 5</text>
        <text x="125" y="16" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Continuity Verification</text>
        <text x="0" y="45" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Verifiable audit trail confirms original IDs, carry-forward counters, and mutual sign-off timestamps.</text>
      </g>

      <!-- Milestone Unique Content -->
      <g transform="translate(0, 110)">
        
  <rect width="1200" height="560" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
  <g transform="translate(30, 25)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Handover Protocol Complete: Verifiable Audit Trail</text>
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Status: Acknowledged • Zero Data Loss • Original Record IDs Fully Preserved</text>

    <!-- Success & Verification Banner -->
    <rect x="0" y="65" width="1140" height="85" rx="6" fill="#F1F5F9" stroke="#CBD5E1" />
    <g transform="translate(25, 22)">
      <circle cx="18" cy="18" r="14" fill="#0F172A" />
      <path d="M12 18 L16 22 L24 14" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <text x="45" y="16" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0F172A">OPERATIONAL CONTINUITY AUDIT VERIFIED</text>
      <text x="45" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Handover HO-8241 acknowledged at 14:00:15. All carried-forward tasks and incidents transitioned to Evening shift.</text>
    </g>

    <!-- 3 Audit Result Cards -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="360" height="250" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="25" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">1. Identity Preservation</text>
      <line x1="25" y1="50" x2="335" y2="50" stroke="#E2E8F0" />
      <g transform="translate(25, 75)">
        <text x="0" y="0" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">TK-8241 → TK-8241</text>
        <text x="0" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">TK-8242 → TK-8242</text>
        <text x="0" y="50" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">IN-3012 → IN-3012</text>
        <text x="0" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Zero duplicates created. Complete historical provenance preserved in local state store.</text>
      </g>

      <rect x="390" y="0" width="360" height="250" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="25" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">2. Provenance Counters</text>
      <line x1="25" y1="50" x2="335" y2="50" stroke="#E2E8F0" />
      <g transform="translate(25, 75)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" fill="#0F172A">Carry Counters Incremented:</text>
        <text x="0" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• TK-8241: Carry count = <tspan font-weight="700">2 (Repeat Risk)</tspan></text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• TK-8242: Carry count = 1</text>
        <text x="0" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• IN-3012: Carry count = <tspan font-weight="700">2 (Repeat Risk)</tspan></text>
        <text x="0" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Risk flags highlighted on Operations Dashboard automatically.</text>
      </g>

      <rect x="780" y="0" width="360" height="250" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="25" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">3. Immutable Sign-Off Log</text>
      <line x1="25" y1="50" x2="335" y2="50" stroke="#E2E8F0" />
      <g transform="translate(25, 75)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Outgoing Lead: <tspan font-weight="700" fill="#0F172A">Priya Nair</tspan></text>
        <text x="0" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Incoming Lead: <tspan font-weight="700" fill="#0F172A">Alex Kumar</tspan></text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Timestamp: <tspan font-weight="700" fill="#0F172A">Today 14:00:15</tspan></text>
        <text x="0" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Collision Notice: <tspan font-weight="700" fill="#0F172A">1 Note Logged</tspan></text>
        <text x="0" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Audit entry recorded in unified activity stream.</text>
      </g>
    </g>

    <!-- Bottom Action Bar -->
    <g transform="translate(0, 445)">
      <rect width="1140" height="50" rx="6" fill="#F1F5F9" stroke="#CBD5E1" />
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Interactive milestone workflow finished. Replay scenario or launch workspace.</text>
      <rect x="760" y="8" width="160" height="34" rx="4" fill="#FFFFFF" stroke="#CBD5E1" />
      <text x="785" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">↺ Replay Demo</text>

      <rect x="940" y="8" width="180" height="34" rx="4" fill="#0F172A" />
      <text x="960" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Open Workspace →</text>
    </g>
  </g>

      </g>
    </g>
  </svg>