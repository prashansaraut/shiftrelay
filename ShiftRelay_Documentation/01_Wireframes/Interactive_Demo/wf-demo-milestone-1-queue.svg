      <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Inspect Boiler Feed Pump 2 Pressure</text>
      <rect x="420" y="12" width="75" height="20" rx="10" fill="#E2E8F0" />
      <text x="435" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">High</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Origin: SH-01 • Carried x1 • Open</text>

      <!-- Task 2 -->
      <rect x="20" y="125" width="510" height="65" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="15" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">TK-8242</text>
      <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Verify Turbine Bearing Oil Temperature</text>
      <rect x="420" y="12" width="75" height="20" rx="10" fill="#E2E8F0" />
      <text x="435" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Medium</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Routine check due at 13:45</text>

      <!-- Task 3 -->
