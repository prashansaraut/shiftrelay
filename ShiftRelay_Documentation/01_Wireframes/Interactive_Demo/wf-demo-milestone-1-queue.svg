      <text x="15" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">TK-8244</text>
      <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Inspect Condensate Polishing Unit Regeneration</text>
      <rect x="420" y="12" width="75" height="20" rx="10" fill="#E2E8F0" />
      <text x="435" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">High</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Resin regeneration phase 2 underway</text>
