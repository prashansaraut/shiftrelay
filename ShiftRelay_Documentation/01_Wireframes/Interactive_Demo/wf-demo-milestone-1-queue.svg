<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="1280" height="900" fill="#F8FAFC" />

    <!-- Top Demo Navigation -->
    <rect width="1280" height="64" fill="#FFFFFF" stroke="#E2E8F0" />
