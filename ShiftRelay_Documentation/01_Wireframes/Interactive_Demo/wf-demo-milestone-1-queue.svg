      <text x="15" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">IN-3012</text>
      <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Cooling Water Line Valve Leakage</text>
      <rect x="430" y="12" width="75" height="20" rx="10" fill="#FEE2E2" />
      <text x="445" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991B1B">Major</text>
      <text x="15" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Status: Under Investigation • Minor packing gland weep detected at 10:15</text>
      <text x="15" y="68" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Origin: SH-01 • Carried x1 • Requires Mandatory Resolution Notes</text>

      <!-- Incident 2 -->
      <rect x="20" y="145" width="520" height="85" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="15" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">IN-3015</text>
      <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Lube Oil Purifier High Differential Pressure Alarm</text>
      <rect x="430" y="12" width="75" height="20" rx="10" fill="#FEF3C7" />
      <text x="445" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#92400E">Moderate</text>
      <text x="15" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Status: Open • Filter element replacement staged for Evening shift</text>
      <text x="15" y="68" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Origin: SH-01 • Carried x0</text>

