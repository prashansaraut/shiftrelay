        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Inspect Queue</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(260, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">2</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Draft Handover</text>
      </g>

      <!-- Step 3 -->
