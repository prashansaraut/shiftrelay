        <text x="20" y="35" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Ready to initiate shift transition protocol?</text>
        <rect x="340" y="12" width="160" height="36" rx="4" fill="#0F172A" />
        <text x="360" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Initiate Handover →</text>
