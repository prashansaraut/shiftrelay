      <text x="15" y="25" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">TK-8243</text>
      <text x="80" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Calibrate Steam Flow Transmitter FT-104</text>
      <rect x="420" y="12" width="75" height="20" rx="10" fill="#E2E8F0" />
      <text x="435" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Low</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Scheduled calibration pending instrument tech</text>

      <!-- Task 4 -->
