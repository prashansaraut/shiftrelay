<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="1280" height="900" fill="#F8FAFC" />

    <!-- Top Demo Navigation -->
    <rect width="1280" height="64" fill="#FFFFFF" stroke="#E2E8F0" />
    <g transform="translate(40, 18)">
      <circle cx="14" cy="14" r="12" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5" />
      <text x="36" y="19" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">ShiftRelay</text>
      <rect x="135" y="2" width="130" height="24" rx="12" fill="#FEF3C7" />
      <text x="148" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400E">Interactive Sandbox</text>
      
      <!-- Right Action Controls -->
      <g transform="translate(900, 0)">
        <rect x="0" y="0" width="80" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="18" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Reset</text>

        <rect x="90" y="0" width="130" height="30" rx="4" fill="#0F172A" />
        <text x="105" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Open Workspace</text>
      </g>
    </g>

    <!-- Stepper Navigation (5 Milestones) -->
    <g transform="translate(40, 85)">
      <rect width="1200" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      
      <!-- Step 1 -->
      <g transform="translate(20, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">1</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Inspect Queue</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(260, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">2</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Draft Handover</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(500, 15)">
        <rect width="215" height="40" rx="6" fill="#0F172A" />
        <circle cx="25" cy="20" r="10" fill="#FFFFFF" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">3</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Conflict Simulation</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(740, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">4</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Incoming Sign-Off</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(980, 15)">
        <rect width="200" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">5</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Continuity Audit</text>
      </g>
    </g>

    <!-- Main Milestone Workspace Canvas -->
    <g transform="translate(40, 180)">
      <!-- Milestone Header Banner -->
      <rect width="1200" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <g transform="translate(30, 25)">
        <rect width="110" height="20" rx="10" fill="#E2E8F0" />
        <text x="15" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">MILESTONE 3 OF 5</text>
        <text x="125" y="16" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Detect Conflict & Edit</text>
        <text x="0" y="45" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">Continuity Engine flags mid-flight concurrency collision and preserves newer state with an audit trail.</text>
      </g>

      <!-- Milestone Unique Content -->
      <g transform="translate(0, 110)">
        
  <rect width="1200" height="560" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
  <g transform="translate(30, 25)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Mid-Flight Concurrency Conflict Simulation</text>
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Simulating a concurrent assignment edit while HO-8241 was awaiting incoming supervisor sign-off.</text>

    <!-- Conflict Warning Alert Banner -->
    <rect x="0" y="65" width="1140" height="75" rx="6" fill="#FEF3C7" stroke="#F59E0B" />
    <g transform="translate(25, 20)">
      <polygon points="12,4 2,24 22,24" fill="#D97706" />
      <text x="10" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">!</text>
      <text x="35" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#92400E">CONCURRENCY COLLISION DETECTED &amp; PRESERVED</text>
      <text x="35" y="38" font-family="system-ui, sans-serif" font-size="12" fill="#B45309">Task TK-8241 was reassigned to Night Shift by Chief Engineer during handover review. Handover draft specified Evening Shift.</text>
    </g>

    <!-- Side-by-Side State Comparison -->
    <g transform="translate(0, 160)">
      <!-- Left: Draft State -->
      <rect x="0" y="0" width="550" height="260" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
      <text x="25" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#64748B">Handover Draft Payload State</text>
      <line x1="25" y1="45" x2="525" y2="45" stroke="#E2E8F0" />
      <g transform="translate(25, 65)">
        <text x="0" y="20" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">TK-8241</text>
        <text x="80" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#0F172A">Inspect Boiler Feed Pump 2 Pressure</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Drafted Target Shift: <tspan font-weight="700" fill="#0F172A">Evening Shift (SH-02)</tspan></text>
        <text x="0" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Draft Timestamp: Today 13:50:00</text>
        <rect x="0" y="95" width="480" height="60" rx="4" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="15" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">In traditional systems, acknowledging this handover would overwrite the concurrent reassignment silently.</text>
      </g>

      <!-- Right: Preserved Newer State -->
      <rect x="580" y="0" width="560" height="260" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
      <text x="25" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Continuity Engine Protected State (Live)</text>
      <line x1="25" y1="45" x2="535" y2="45" stroke="#E2E8F0" />
      <g transform="translate(25, 65)">
        <text x="0" y="20" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">TK-8241</text>
        <text x="80" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Inspect Boiler Feed Pump 2 Pressure</text>
        <text x="0" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Preserved Shift: Night Shift (SH-03) ✓</text>
        <text x="0" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Concurrent Update Timestamp: Today 13:52:14</text>
        <rect x="0" y="95" width="490" height="60" rx="4" fill="#F1F5F9" stroke="#CBD5E1" />
        <text x="15" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Continuity Engine Guarantee:</text>
        <text x="15" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#475569">The newer Night Shift assignment is protected. Handover logs conflict note automatically.</text>
      </g>
    </g>

    <!-- Bottom Action Bar -->
    <g transform="translate(0, 445)">
      <rect width="1140" height="50" rx="6" fill="#F1F5F9" stroke="#CBD5E1" />
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Conflict visualized. Proceed to incoming supervisor acknowledgement.</text>
      <rect x="910" y="8" width="210" height="34" rx="4" fill="#0F172A" />
      <text x="930" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Proceed to Incoming Sign-Off →</text>
    </g>
  </g>

      </g>
    </g>
  </svg>