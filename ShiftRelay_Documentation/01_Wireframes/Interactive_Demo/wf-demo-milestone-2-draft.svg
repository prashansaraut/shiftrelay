<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="1280" height="900" fill="#F8FAFC" />

    <!-- Top Demo Navigation -->
    <rect width="1280" height="64" fill="#FFFFFF" stroke="#E2E8F0" />
    <g transform="translate(40, 18)">
      <circle cx="14" cy="14" r="12" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5" />
      <text x="36" y="19" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">ShiftRelay</text>
      <rect x="135" y="2" width="130" height="24" rx="12" fill="#FEF3C7" />
      <text x="148" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400E">Interactive Sandbox</text>
      
      <!-- Right Action Controls -->
      <g transform="translate(900, 0)">
        <rect x="0" y="0" width="80" height="30" rx="4" fill="#FFFFFF" stroke="#CBD5E1" />
        <text x="18" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Reset</text>

        <rect x="90" y="0" width="130" height="30" rx="4" fill="#0F172A" />
        <text x="105" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Open Workspace</text>
      </g>
    </g>

    <!-- Stepper Navigation (5 Milestones) -->
    <g transform="translate(40, 85)">
      <rect width="1200" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      
      <!-- Step 1 -->
      <g transform="translate(20, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">1</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Inspect Queue</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(260, 15)">
        <rect width="215" height="40" rx="6" fill="#0F172A" />
        <circle cx="25" cy="20" r="10" fill="#FFFFFF" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">2</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Draft Handover</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(500, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">3</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Conflict Simulation</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(740, 15)">
        <rect width="215" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">4</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Incoming Sign-Off</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(980, 15)">
        <rect width="200" height="40" rx="6" fill="#F1F5F9" />
        <circle cx="25" cy="20" r="10" fill="#CBD5E1" />
        <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#475569">5</text>
        <text x="45" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">Continuity Audit</text>
      </g>
    </g>

    <!-- Main Milestone Workspace Canvas -->
    <g transform="translate(40, 180)">
      <!-- Milestone Header Banner -->
      <rect width="1200" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
      <g transform="translate(30, 25)">
        <rect width="110" height="20" rx="10" fill="#E2E8F0" />
        <text x="15" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">MILESTONE 2 OF 5</text>
        <text x="125" y="16" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Initiate Handover Protocol</text>
        <text x="0" y="45" font-family="system-ui, sans-serif" font-size="13" fill="#64748B">System aggregates all open shift records into a structured draft with priority hand-off notes.</text>
      </g>

      <!-- Milestone Unique Content -->
      <g transform="translate(0, 110)">
        
  <rect width="1200" height="560" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
  <g transform="translate(30, 25)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Initiating Handover Protocol: HO-8241 (Draft Mode)</text>
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">From: Morning Shift (Priya Nair) → To: Evening Shift (Alex Kumar) | Protocol Lock Active</text>

    <!-- Handover Draft Summary Card -->
    <rect x="0" y="65" width="1140" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <g transform="translate(25, 25)">
      <text x="0" y="20" font-family="monospace" font-size="14" font-weight="800" fill="#0F172A">HO-8241</text>
      <rect x="90" y="6" width="60" height="20" rx="4" fill="#FEF3C7" />
      <text x="105" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#92400E">Draft</text>
      <text x="0" y="55" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Morning Shift to Evening Shift Continuity Handover</text>
      <text x="0" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Attached payload: 4 tasks and 2 incidents automatically locked into custody transition queue.</text>
    </g>

    <!-- Middle Split: Priority Hand-off Notes & Attached Queue -->
    <g transform="translate(0, 195)">
      <rect width="600" height="230" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Outgoing Supervisor Priority Notes</text>
      <rect x="20" y="45" width="560" height="150" rx="4" fill="#F8FAFC" stroke="#CBD5E1" />
      <text x="35" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#334155">• Boiler Feed Pump 2 seal water flow is fluctuating; re-check pressure before peak demand.</text>
      <text x="35" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#334155">• Cooling water line valve weep isolated with containment kit; maintenance team notified.</text>
      <text x="35" y="120" font-family="system-ui, sans-serif" font-size="12" fill="#334155">• Resin regeneration underway on CPU; Evening shift to verify rinse conductivity.</text>
    </g>

    <g transform="translate(620, 195)">
      <rect width="520" height="230" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Continuity Engine Verification Rules</text>
      <g transform="translate(20, 50)">
        <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">✓ Unresolved Task Aggregation: Complete (4 items)</text>
        <text x="0" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">✓ Unresolved Incident Aggregation: Complete (2 items)</text>
        <text x="0" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">✓ Record Identity Provenance: All IDs will be preserved</text>
        <text x="0" y="95" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">✓ Protocol State: Transitions to 'Awaiting Acknowledgement'</text>
      </g>
    </g>

    <!-- Bottom Action Bar -->
    <g transform="translate(0, 445)">
      <rect width="1140" height="50" rx="6" fill="#F1F5F9" stroke="#CBD5E1" />
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Step 2: Generate draft and simulate concurrency collision test.</text>
      <rect x="910" y="8" width="210" height="34" rx="4" fill="#0F172A" />
      <text x="930" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Submit Handover for Sign-Off →</text>
    </g>
  </g>

      </g>
    </g>
  </svg>