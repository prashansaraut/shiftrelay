<svg width="1200" height="850" viewBox="0 0 1200 850" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="850" fill="#F8FAFC" />

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#FFFFFF" stroke="#E2E8F0" />
  <text x="40" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F172A">ShiftRelay — Complete Information Architecture &amp; Visual Application Sitemap</text>
  <text x="960" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Architectural Topology Map</text>

  <!-- Root: Landing Page -->
  <rect x="460" y="100" width="280" height="60" rx="8" fill="#0F172A" />
  <text x="600" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Public Landing Page (/)</text>

  <!-- Split Connectors -->
  <path d="M530 160 v40 h-280 v40" stroke="#0F172A" stroke-width="2" fill="none" />
  <path d="M670 160 v40 h280 v40" stroke="#0F172A" stroke-width="2" fill="none" />

  <!-- Branch 1: Interactive Demo Container -->
  <rect x="100" y="240" width="300" height="560" rx="10" fill="#FFFFFF" stroke="#CBD5E1" />
  <rect x="100" y="240" width="300" height="44" rx="10 10 0 0" fill="#F1F5F9" stroke="#CBD5E1" />
  <text x="250" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Interactive Demo (/demo)</text>

  <!-- Demo Steps -->
  <g transform="translate(120, 304)">
    <rect y="0" width="260" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">1. Outgoing Inspection</text>

    <rect y="56" width="260" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="83" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">2. Handover Draft</text>

    <rect y="112" width="260" height="44" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="16" y="139" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">3. Conflict Detection (TK-1002)</text>

    <rect y="168" width="260" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="195" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">4. Incoming Sign-off</text>

    <rect y="224" width="260" height="44" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="251" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">5. Continuity Audit</text>

    <!-- Demo Reset -->
    <rect y="280" width="260" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="130" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Reset Demo Simulation</text>
  </g>

  <!-- Branch 2: Operational Workspace Container -->
  <rect x="460" y="240" width="690" height="560" rx="10" fill="#FFFFFF" stroke="#CBD5E1" />
  <rect x="460" y="240" width="690" height="44" rx="10 10 0 0" fill="#F1F5F9" stroke="#CBD5E1" />
  <text x="805" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Operational Workspace (/app/*)</text>

  <!-- Operational Modules Grid -->
  <g transform="translate(480, 304)">
    <!-- Dashboard -->
    <rect x="0" y="0" width="310" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Dashboard (/app/dashboard)</text>
    <text x="16" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Live metrics, active custody widget, task queue</text>

    <!-- Shifts -->
    <rect x="330" y="0" width="310" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Shifts (/app/shifts)</text>
    <text x="16" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Rosters; Create Shift page at /app/shifts/new</text>

    <!-- Handovers -->
    <rect x="0" y="70" width="310" height="56" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="16" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Handovers (/app/handovers)</text>
    <text x="16" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#0F172A">Full detail page at /app/handovers/:id</text>

    <!-- Tasks -->
    <rect x="330" y="70" width="310" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Tasks (/app/tasks)</text>
    <text x="16" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Carry counters, Create Task page at /app/tasks/new</text>

    <!-- Incidents -->
    <rect x="0" y="140" width="310" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="168" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Incidents (/app/incidents)</text>
    <text x="16" y="184" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">4 severity tiers, Create page at /app/incidents/new</text>

    <!-- Activity -->
    <rect x="330" y="140" width="310" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="168" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Activity Log (/app/activity)</text>
    <text x="16" y="184" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Immutable timestamped audit stream of all transitions</text>

    <!-- Settings -->
    <rect x="0" y="210" width="640" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="16" y="238" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Settings &amp; Preferences (/app/settings)</text>
    <text x="16" y="254" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">3 simulated roles, Light/Dark theme toggle, display name, reset demo state</text>

    <!-- Continuity Engine Box -->
    <rect x="0" y="280" width="640" height="90" rx="8" fill="#F1F5F9" stroke="#0F172A" />
    <text x="24" y="308" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Core Continuity Engine (Client-Side Invariant Architecture)</text>
    <text x="24" y="328" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Unbroken ID Preservation: items retain original keys across shift rollovers</text>
    <text x="24" y="346" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Sign-Off Protocol: Draft → Submitted → Awaiting Acknowledgement → Acknowledged</text>
    <text x="24" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Concurrency Conflict Protection: Prevents lost updates during active handover staging</text>
  </g>
</svg>