<svg width="1200" height="850" viewBox="0 0 1200 850" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="850" fill="#F8FAFC" />
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#FFFFFF" stroke="#E2E8F0" />
  <text x="40" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F172A">ShiftRelay — Low-Fidelity UI Component Library &amp; Figma Master Kit</text>
  <text x="960" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#64748B">Version 1.0 • Wireframe Specs</text>

  <!-- Section 1: Buttons & Interactive Controls -->
  <g transform="translate(40, 100)">
    <rect width="340" height="340" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">1. Buttons &amp; Action Triggers</text>
    
    <!-- Primary Button -->
    <rect x="20" y="55" width="140" height="40" rx="6" fill="#0F172A" />
    <text x="48" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Primary Action</text>

    <!-- Secondary Button -->
    <rect x="180" y="55" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="200" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Secondary Btn</text>

    <!-- Small Button -->
    <rect x="20" y="110" width="95" height="32" rx="4" fill="#E2E8F0" />
    <text x="35" y="131" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">Compact</text>

    <!-- Icon Button -->
    <rect x="130" y="110" width="32" height="32" rx="4" fill="#FFFFFF" stroke="#CBD5E1" />
    <circle cx="146" cy="126" r="6" stroke="#475569" stroke-width="1.5" fill="none" />

    <!-- Destructive Button -->
    <rect x="180" y="110" width="140" height="32" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="2 2" />
    <text x="208" y="131" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Outline Action</text>

    <!-- Stepper Buttons -->
    <text x="20" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">Stepper Milestone Tabs:</text>
    <rect x="20" y="190" width="140" height="38" rx="6" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5" />
    <circle cx="38" cy="209" r="10" fill="#0F172A" />
    <text x="35" y="213" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
    <text x="56" y="213" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Active Step</text>

    <rect x="175" y="190" width="145" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
    <circle cx="193" cy="209" r="10" fill="#E2E8F0" />
    <text x="190" y="213" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">2</text>
    <text x="211" y="213" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Pending Step</text>

    <!-- Theme & Hamburger Toggles -->
    <text x="20" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">Navbar Controls:</text>
    <rect x="20" y="275" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
    <path d="M40 287 C44 287 47 290 47 294 C47 298 44 301 40 301 C42 299 43 296 43 294 C43 292 42 289 40 287 Z" fill="#0F172A" />

    <rect x="75" y="275" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
    <line x1="83" y1="287" x2="107" y2="287" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
    <line x1="83" y1="295" x2="107" y2="295" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
    <line x1="83" y1="303" x2="107" y2="303" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />

    <rect x="130" y="275" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
    <line x1="140" y1="285" x2="160" y2="305" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
    <line x1="160" y1="285" x2="140" y2="305" stroke="#0F172A" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Section 2: Form Inputs & Controls -->
  <g transform="translate(420, 100)">
    <rect width="340" height="340" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">2. Form Fields &amp; Input Placeholders</text>
    
    <!-- Text Input -->
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Field Label</text>
    <rect x="20" y="68" width="300" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="32" y="92" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Enter placeholder text...</text>

    <!-- Select / Dropdown Input -->
    <text x="20" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Select Role / Category</text>
    <rect x="20" y="138" width="300" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="32" y="162" font-family="system-ui, sans-serif" font-size="12" fill="#0F172A">Operations Manager (Simulated)</text>
    <path d="M300 154 L305 160 L310 154" fill="none" stroke="#475569" stroke-width="1.5" />

    <!-- Textarea Input -->
    <text x="20" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Resolution Notes (Mandatory for Incidents)</text>
    <rect x="20" y="208" width="300" height="70" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="32" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Detailed explanation of root cause and preventive measures...</text>

    <!-- Search Input -->
    <rect x="20" y="290" width="300" height="34" rx="17" fill="#F1F5F9" stroke="#E2E8F0" />
    <circle cx="36" cy="307" r="5" stroke="#94A3B8" stroke-width="1.2" fill="none" />
    <line x1="40" y1="311" x2="44" y2="315" stroke="#94A3B8" stroke-width="1.2" />
    <text x="54" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Search tasks, incidents, handovers...</text>
  </g>

  <!-- Section 3: Status Tags & Badges -->
  <g transform="translate(800, 100)">
    <rect width="360" height="340" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">3. Badges, Chips &amp; Status Indicators</text>

    <!-- Task Status Chips -->
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Task States:</text>
    <rect x="20" y="70" width="60" height="24" rx="12" fill="#E2E8F0" />
    <text x="35" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155">Open</text>

    <rect x="90" y="70" width="75" height="24" rx="12" fill="#F1F5F9" stroke="#CBD5E1" />
    <text x="100" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569">In Progress</text>

    <rect x="175" y="70" width="70" height="24" rx="12" fill="#E2E8F0" stroke="#94A3B8" />
    <text x="187" y="86" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0F172A">Completed</text>

    <!-- Handover Badges -->
    <text x="20" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Handover Workflow States:</text>
    <rect x="20" y="135" width="55" height="22" rx="4" fill="#F1F5F9" stroke="#CBD5E1" />
    <text x="30" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155">Draft</text>

    <rect x="85" y="135" width="70" height="22" rx="4" fill="#E2E8F0" />
    <text x="96" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0F172A">Submitted</text>

    <rect x="165" y="135" width="90" height="22" rx="4" fill="#0F172A" />
    <text x="176" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Acknowledged</text>

    <!-- Carry Count Pill -->
    <text x="20" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Continuity Provenance Tags:</text>
    <rect x="20" y="200" width="85" height="22" rx="11" fill="#E2E8F0" stroke="#CBD5E1" />
    <circle cx="31" cy="211" r="3" fill="#0F172A" />
    <text x="39" y="215" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Carried x1</text>

    <rect x="115" y="200" width="95" height="22" rx="11" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />
    <text x="127" y="215" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Rollover Risk (2+)</text>

    <!-- Avatar Placeholder -->
    <text x="20" y="255" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Avatar / Identity Initials:</text>
    <circle cx="40" cy="285" r="18" fill="#0F172A" />
    <text x="31" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">PN</text>

    <circle cx="90" cy="285" r="18" fill="#E2E8F0" stroke="#CBD5E1" />
    <text x="81" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">AK</text>
  </g>

  <!-- Section 4: Data Card Layouts & Metric Units -->
  <g transform="translate(40, 480)">
    <rect width="1120" height="320" rx="8" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="25" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">4. Card Containers, Layout Primitives &amp; Structural Modules</text>

    <!-- Metric Card Wireframe -->
    <rect x="25" y="55" width="250" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="45" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Carried-Forward Items</text>
    <text x="45" y="125" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#0F172A">4</text>
    <text x="45" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Across active shifts</text>

    <!-- Repeat Rollover Metric Card -->
    <rect x="300" y="55" width="250" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="320" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Repeat Rollover Risk</text>
    <text x="320" y="125" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#0F172A">1</text>
    <text x="320" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Items rolled 2+ times</text>

    <!-- Open Incidents Card -->
    <rect x="575" y="55" width="250" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="595" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Open Incidents</text>
    <text x="595" y="125" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#0F172A">2</text>
    <text x="595" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Under Investigation</text>

    <!-- Active Tasks Card -->
    <rect x="850" y="55" width="245" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="870" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Pending Tasks</text>
    <text x="870" y="125" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#0F172A">4</text>
    <text x="870" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Requiring custody</text>

    <!-- Table Row Structure Wireframe -->
    <rect x="25" y="190" width="1070" height="100" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <!-- Table Header Row -->
    <rect x="25" y="190" width="1070" height="34" fill="#F1F5F9" stroke="#E2E8F0" />
    <text x="45" y="212" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">RECORD ID</text>
    <text x="160" y="212" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">TITLE &amp; DESCRIPTION</text>
    <text x="480" y="212" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">ASSIGNED SHIFT</text>
    <text x="680" y="212" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">STATUS / PRIORITY</text>
    <text x="880" y="212" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">PROVENANCE</text>
    <text x="1010" y="212" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">ACTIONS</text>

    <!-- Table Sample Row -->
    <line x1="25" y1="256" x2="1095" y2="256" stroke="#E2E8F0" />
    <text x="45" y="246" font-family="monospace" font-size="11" font-weight="700" fill="#0F172A">TK-8241</text>
    <text x="160" y="246" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Inspect Boiler Feed Pump 2 Pressure</text>
    <text x="480" y="246" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Morning Shift</text>
    <rect x="680" y="234" width="60" height="20" rx="10" fill="#E2E8F0" />
    <text x="696" y="248" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0F172A">High</text>
    <text x="880" y="246" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Origin: SH-01 (x0)</text>
    <rect x="1005" y="234" width="70" height="22" rx="4" fill="#F1F5F9" stroke="#CBD5E1" />
    <text x="1018" y="249" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0F172A">Action</text>
  </g>
</svg>