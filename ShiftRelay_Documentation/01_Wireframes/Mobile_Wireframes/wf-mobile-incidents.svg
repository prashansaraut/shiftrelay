<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="390" height="844" fill="#F8FAFC" />

  <!-- Mobile Topbar -->
  <rect x="0" y="0" width="390" height="56" fill="#FFFFFF" stroke="#E2E8F0" />
  <text x="20" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Incident Anomaly Log</text>
  <rect x="290" y="12" width="80" height="32" rx="4" fill="#0F172A" />
  <text x="306" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">+ Anomaly</text>

  <!-- Incident Card (Critical with Bottom Sheet Trigger) -->
  <g transform="translate(20, 72)">
    <rect width="350" height="140" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">INC-402</text>
    <rect x="74" y="12" width="68" height="18" rx="4" fill="#0F172A" />
    <text x="82" y="25" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">CRITICAL</text>

    <text x="16" y="54" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Coolant Loop Pressure Variance</text>
    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Pressure spiked +14% at 14:20 during Shift Alpha</text>
    
    <rect x="16" y="88" width="318" height="36" rx="6" fill="#F1F5F9" stroke="#0F172A" />
    <text x="100" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Resolve with Required Notes â†’</text>
  </g>

  <!-- Slide-up Resolution Notes Sheet (Mobile Modal) -->
  <g transform="translate(0, 240)">
    <rect width="390" height="604" rx="16 16 0 0" fill="#FFFFFF" stroke="#E2E8F0" />
    <!-- Drag Handle -->
    <rect x="175" y="12" width="40" height="4" rx="2" fill="#CBD5E1" />

    <text x="24" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Resolve Incident Anomaly</text>
    <text x="24" y="64" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Mandatory resolution notes protocol active</text>

    <!-- Mandatory Warning Banner -->
    <rect x="24" y="80" width="342" height="52" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="36" y="102" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Resolution Note Required</text>
    <text x="36" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Specify root cause or mitigating action taken.</text>

    <text x="24" y="156" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Resolution Summary *</text>
    <rect x="24" y="168" width="342" height="110" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="36" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#0F172A">Bypass valve recalibrated to 24 PSI.</text>
    <text x="36" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#0F172A">Pressure stabilized across 40 minute test.</text>

    <!-- Sign-off Button -->
    <rect x="24" y="300" width="342" height="44" rx="6" fill="#0F172A" />
    <text x="100" y="327" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Commit Anomaly Resolution</text>
  </g>
</svg>