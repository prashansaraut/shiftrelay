<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Wireframe: Landing Page Desktop</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <rect width="1280" height="900" fill="#F8FAFC"/>
  
  <!-- Top Nav Wireframe -->
  <rect x="0" y="0" width="1280" height="70" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="60" y="20" width="140" height="30" rx="4" fill="#CBD5E1"/>
  <rect x="400" y="25" width="80" height="20" rx="4" fill="#E2E8F0"/>
  <rect x="510" y="25" width="80" height="20" rx="4" fill="#E2E8F0"/>
  <rect x="620" y="25" width="110" height="20" rx="4" fill="#E2E8F0"/>
  <rect x="760" y="25" width="70" height="20" rx="4" fill="#E2E8F0"/>
  <rect x="990" y="16" width="110" height="38" rx="6" fill="#E2E8F0"/>
  <rect x="1115" y="16" width="105" height="38" rx="6" fill="#94A3B8"/>

  <!-- Hero Content Left -->
  <rect x="60" y="130" width="220" height="28" rx="14" fill="#E2E8F0"/>
  <text x="60" y="210" fill="#0F172A" font-size="44" font-weight="800" class="font-sans">[HERO HEADLINE: Never drop the baton]</text>
  <rect x="60" y="240" width="520" height="16" rx="4" fill="#E2E8F0"/>
  <rect x="60" y="265" width="480" height="16" rx="4" fill="#E2E8F0"/>
  <rect x="60" y="290" width="390" height="16" rx="4" fill="#E2E8F0"/>

  <rect x="60" y="340" width="190" height="48" rx="8" fill="#94A3B8"/>
  <text x="85" y="370" fill="#FFFFFF" font-size="14" font-weight="700" class="font-body">[Explore Demo CTA]</text>

  <rect x="265" y="340" width="170" height="48" rx="8" fill="#E2E8F0" stroke="#CBD5E1"/>
  <text x="290" y="370" fill="#475467" font-size="14" font-weight="700" class="font-body">[Open Workspace]</text>

  <!-- Value Checkmarks -->
  <rect x="60" y="420" width="140" height="18" rx="4" fill="#E2E8F0"/>
  <rect x="220" y="420" width="150" height="18" rx="4" fill="#E2E8F0"/>
  <rect x="390" y="420" width="140" height="18" rx="4" fill="#E2E8F0"/>

  <!-- Hero Product Mockup Right -->
  <rect x="650" y="130" width="570" height="400" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="650" y="130" width="570" height="40" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
  <circle cx="675" cy="150" r="5" fill="#CBD5E1"/>
  <circle cx="690" cy="150" r="5" fill="#CBD5E1"/>
  <circle cx="705" cy="150" r="5" fill="#CBD5E1"/>
  <rect x="730" y="140" width="220" height="20" rx="4" fill="#E2E8F0"/>
  
  <!-- Handover Card in Preview -->
  <rect x="680" y="190" width="510" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="700" y="225" fill="#475467" font-size="15" font-weight="700" class="font-sans">[Handover Card: Morning ➔ Evening]</text>

  <!-- Items in Preview -->
  <rect x="680" y="265" width="510" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="700" y="293" fill="#64748B" font-size="13" class="font-body">[Critical Incident Attached: Fire Exit Blocked]</text>

  <rect x="680" y="320" width="510" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="700" y="348" fill="#64748B" font-size="13" class="font-body">[Task Attached: Conveyor Belt 3 - In Progress]</text>

  <rect x="680" y="375" width="510" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="700" y="403" fill="#64748B" font-size="13" class="font-body">[Task Attached: Calibrate Scanner - Carried 2x]</text>

  <rect x="680" y="435" width="510" height="40" rx="6" fill="#E2E8F0"/>
  <text x="700" y="460" fill="#475467" font-size="13" font-weight="600" class="font-body">[Incoming Supervisor Verification Acknowledged]</text>

  <!-- Workflow Section Preview Wireframe -->
  <text x="60" y="600" fill="#0F172A" font-size="24" font-weight="800" class="font-sans">[5-Stage Operational Workflow]</text>
  <g transform="translate(60, 630)">
    <rect x="0" y="0" width="215" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="15" y="35" font-weight="700" fill="#475467" class="font-sans">01. Record</text>
    <rect x="15" y="55" width="180" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="15" y="75" width="140" height="12" rx="3" fill="#E2E8F0"/>

    <rect x="235" y="0" width="215" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="250" y="35" font-weight="700" fill="#475467" class="font-sans">02. Prepare</text>
    <rect x="250" y="55" width="180" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="250" y="75" width="140" height="12" rx="3" fill="#E2E8F0"/>

    <rect x="470" y="0" width="215" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="485" y="35" font-weight="700" fill="#475467" class="font-sans">03. Review</text>
    <rect x="485" y="55" width="180" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="485" y="75" width="140" height="12" rx="3" fill="#E2E8F0"/>

    <rect x="705" y="0" width="215" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="720" y="35" font-weight="700" fill="#475467" class="font-sans">04. Relay</text>
    <rect x="720" y="55" width="180" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="720" y="75" width="140" height="12" rx="3" fill="#E2E8F0"/>

    <rect x="940" y="0" width="220" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="955" y="35" font-weight="700" fill="#475467" class="font-sans">05. Close</text>
    <rect x="955" y="55" width="180" height="12" rx="3" fill="#E2E8F0"/>
    <rect x="955" y="75" width="140" height="12" rx="3" fill="#E2E8F0"/>
  </g>

</svg>