<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ShiftRelay Wireframe - Interactive Demo Flow</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
  <rect width="1200" height="800" fill="#0B0F19"/>
  
  <rect x="40" y="40" width="1120" height="720" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="64" rx="16" fill="#1F2937"/>
  <text x="72" y="80" fill="#F9FAFB" font-size="18" font-weight="bold" class="font-sans">ShiftRelay Demo Experience — 5-Step Guided Simulator</text>
  <rect x="980" y="56" width="140" height="32" rx="8" fill="#2563EB"/>
  <text x="1010" y="77" fill="#FFFFFF" font-size="13" font-weight="600" class="font-sans">Exit to App</text>
  
  <g transform="translate(72, 130)">
    <rect width="1056" height="70" rx="12" fill="#1F2937" stroke="#374151"/>
    <circle cx="60" cy="35" r="16" fill="#2563EB"/><text x="55" y="40" fill="#fff" font-size="12" font-weight="bold" class="font-sans">1</text>
    <text x="86" y="40" fill="#F3F4F6" font-size="13" font-weight="600" class="font-sans">Inspect Outgoing</text>
    <line x1="220" y1="35" x2="280" y2="35" stroke="#4B5563" stroke-width="2"/>
    <circle cx="310" cy="35" r="16" fill="#374151"/><text x="305" y="40" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">2</text>
    <text x="336" y="40" fill="#9CA3AF" font-size="13" class="font-sans">Draft Handover</text>
    <line x1="460" y1="35" x2="520" y2="35" stroke="#4B5563" stroke-width="2"/>
    <circle cx="550" cy="35" r="16" fill="#EF4444"/><text x="545" y="40" fill="#fff" font-size="12" font-weight="bold" class="font-sans">!</text>
    <text x="576" y="40" fill="#FCA5A5" font-size="13" class="font-sans">Mid-Shift Conflict</text>
    <line x1="710" y1="35" x2="770" y2="35" stroke="#4B5563" stroke-width="2"/>
    <circle cx="800" cy="35" r="16" fill="#374151"/><text x="795" y="40" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">4</text>
    <text x="826" y="40" fill="#9CA3AF" font-size="13" class="font-sans">Acknowledge</text>
    <line x1="930" y1="35" x2="980" y2="35" stroke="#4B5563" stroke-width="2"/>
    <circle cx="1005" cy="35" r="16" fill="#10B981"/><text x="1000" y="40" fill="#fff" font-size="12" font-weight="bold" class="font-sans">✓</text>
  </g>

  <g transform="translate(72, 230)">
    <rect width="480" height="490" rx="12" fill="#1F2937" stroke="#374151"/>
    <text x="24" y="40" fill="#60A5FA" font-size="14" font-weight="bold" class="font-sans">STEP EXPLANATION &amp; ACTIONS</text>
    <text x="24" y="80" fill="#F9FAFB" font-size="20" font-weight="bold" class="font-sans">Milestone 3: Safe Mid-Flight Conflict</text>
    <text x="24" y="120" fill="#9CA3AF" font-size="14" class="font-sans">Simulate another supervisor re-assigning task TSK-104</text>
    <text x="24" y="145" fill="#9CA3AF" font-size="14" class="font-sans">to Night Shift while this handover is pending.</text>
    <rect x="24" y="190" width="432" height="120" rx="8" fill="#2A171B" stroke="#EF4444" stroke-width="1"/>
    <text x="40" y="225" fill="#F87171" font-size="13" font-weight="bold" class="font-sans">Conflict Detected by Continuity Engine:</text>
    <text x="40" y="255" fill="#FECACA" font-size="13" class="font-sans">Task TSK-104 reassigned externally to SH-NIGHT.</text>
    <text x="40" y="280" fill="#FECACA" font-size="13" class="font-sans">Continuity Engine will preserve reassignment.</text>
    <rect x="24" y="350" width="200" height="44" rx="8" fill="#EF4444"/>
    <text x="54" y="378" fill="#FFFFFF" font-size="14" font-weight="600" class="font-sans">Trigger Conflict</text>
    <rect x="240" y="350" width="216" height="44" rx="8" fill="#2563EB"/>
    <text x="265" y="378" fill="#FFFFFF" font-size="14" font-weight="600" class="font-sans">Proceed to Sign-off →</text>
  </g>

  <g transform="translate(576, 230)">
    <rect width="552" height="490" rx="12" fill="#1F2937" stroke="#374151"/>
    <text x="24" y="40" fill="#10B981" font-size="14" font-weight="bold" class="font-sans">SIMULATED IN-MEMORY DATABASE</text>
    <rect x="24" y="65" width="504" height="95" rx="8" fill="#111827" stroke="#374151"/>
    <text x="40" y="95" fill="#E5E7EB" font-size="13" font-weight="600" class="font-sans">HO-8241 (Draft) — Morning to Evening</text>
    <text x="40" y="120" fill="#9CA3AF" font-size="12" class="font-sans">From: Sarah Jenkins (Ops Lead) • To: Marcus Vance</text>
    <text x="40" y="142" fill="#F59E0B" font-size="12" class="mono">STATUS: DRAFT • 2 TASKS • 1 INCIDENT</text>

    <rect x="24" y="175" width="504" height="135" rx="8" fill="#111827" stroke="#EF4444"/>
    <text x="40" y="205" fill="#F87171" font-size="13" font-weight="600" class="font-sans">TSK-104: Turbine Vibration Diagnostics</text>
    <text x="40" y="230" fill="#9CA3AF" font-size="12" class="font-sans">Original Shift: SH-MORN • Current Assigned Shift: SH-NIGHT</text>
    <text x="40" y="255" fill="#FCA5A5" font-size="12" class="font-sans">Warning: External modification detected after draft creation.</text>
    <text x="40" y="285" fill="#60A5FA" font-size="12" class="mono">PRESERVATION RULE: KEEP EXTERNAL MODIFICATION</text>

    <rect x="24" y="325" width="504" height="135" rx="8" fill="#111827" stroke="#374151"/>
    <text x="40" y="355" fill="#E5E7EB" font-size="13" font-weight="600" class="font-sans">INC-402: Primary Coolant Flow Sensor Drift</text>
    <text x="40" y="380" fill="#EF4444" font-size="12" font-weight="600" class="font-sans">CRITICAL SEVERITY • UNRESOLVED</text>
    <text x="40" y="405" fill="#9CA3AF" font-size="12" class="font-sans">Mandatory Continuity Transfer: carryForward = 1</text>
  </g>

</svg>