<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Wireframe: Workspace Dashboard</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <rect width="1280" height="900" fill="#F8FAFC"/>
  
  <!-- Sidebar Wireframe -->
  <rect x="0" y="0" width="240" height="900" fill="#0F172A"/>
  <rect x="20" y="25" width="150" height="32" rx="6" fill="#334155"/>
  
  <rect x="15" y="85" width="210" height="38" rx="6" fill="#2563EB"/>
  <text x="35" y="108" fill="#FFFFFF" font-size="14" font-weight="600" class="font-sans">Dashboard (Active)</text>

  <rect x="15" y="130" width="210" height="38" rx="6" fill="transparent"/>
  <text x="35" y="153" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Shifts</text>

  <rect x="15" y="175" width="210" height="38" rx="6" fill="transparent"/>
  <text x="35" y="198" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Handovers</text>

  <rect x="15" y="220" width="210" height="38" rx="6" fill="transparent"/>
  <text x="35" y="243" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Tasks</text>

  <rect x="15" y="265" width="210" height="38" rx="6" fill="transparent"/>
  <text x="35" y="288" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Incidents</text>

  <rect x="15" y="310" width="210" height="38" rx="6" fill="transparent"/>
  <text x="35" y="333" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Activity</text>

  <rect x="15" y="355" width="210" height="38" rx="6" fill="transparent"/>
  <text x="35" y="378" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Settings</text>

  <!-- Top Bar -->
  <rect x="240" y="0" width="1040" height="65" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="270" y="15" width="360" height="36" rx="6" fill="#F1F5F9"/>
  <text x="290" y="38" fill="#94A3B8" font-size="13" class="font-body">Search tasks, incidents, handovers...</text>
  <rect x="1100" y="18" width="150" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="1115" y="38" fill="#2563EB" font-size="12" font-weight="700" class="font-body">Operations Manager</text>

  <!-- Page Head -->
  <text x="270" y="115" fill="#0F172A" font-size="24" font-weight="800" class="font-sans">Operations Dashboard</text>
  <rect x="1060" y="90" width="190" height="40" rx="6" fill="#2563EB"/>
  <text x="1080" y="115" fill="#FFFFFF" font-size="13" font-weight="700" class="font-body">+ Prepare Handover</text>

  <!-- 6 Stat Cards Grid -->
  <g transform="translate(270, 140)">
    <rect x="0" y="0" width="155" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="15" y="35" fill="#2563EB" font-size="28" font-weight="800" class="font-sans">1</text>
    <text x="15" y="65" fill="#64748B" font-size="12" class="font-body">Active Shifts</text>

    <rect x="165" y="0" width="155" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="180" y="35" fill="#D97706" font-size="28" font-weight="800" class="font-sans">0</text>
    <text x="180" y="65" fill="#64748B" font-size="12" class="font-body">Awaiting Sign-off</text>

    <rect x="330" y="0" width="155" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="345" y="35" fill="#0F172A" font-size="28" font-weight="800" class="font-sans">5</text>
    <text x="345" y="65" fill="#64748B" font-size="12" class="font-body">Open Tasks</text>

    <rect x="495" y="0" width="155" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="510" y="35" fill="#DC2626" font-size="28" font-weight="800" class="font-sans">1</text>
    <text x="510" y="65" fill="#64748B" font-size="12" class="font-body">Critical Incidents</text>

    <rect x="660" y="0" width="155" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="675" y="35" fill="#D97706" font-size="28" font-weight="800" class="font-sans">1</text>
    <text x="675" y="65" fill="#64748B" font-size="12" class="font-body">Carried Forward</text>

    <rect x="825" y="0" width="155" height="85" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="840" y="35" fill="#DC2626" font-size="28" font-weight="800" class="font-sans">1</text>
    <text x="840" y="65" fill="#64748B" font-size="12" class="font-body">Overdue Tasks</text>
  </g>

  <!-- 2 Column Section -->
  <rect x="270" y="250" width="480" height="260" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="295" y="285" fill="#0F172A" font-size="16" font-weight="700" class="font-sans">Continuity Risks (3)</text>
  <rect x="295" y="310" width="430" height="36" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="310" y="333" fill="#DC2626" font-size="13" font-weight="600" class="font-body">IN-2001: Fire exit blocked (Critical Incident)</text>

  <rect x="295" y="355" width="430" height="36" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="310" y="378" fill="#DC2626" font-size="13" font-weight="600" class="font-body">TK-1003: Calibrate forklift scanner (Overdue)</text>

  <rect x="295" y="400" width="430" height="36" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="310" y="423" fill="#D97706" font-size="13" font-weight="600" class="font-body">TK-1003: Carried forward 2x (Repeat Risk)</text>

  <!-- Right Column: Priority Bar Chart -->
  <rect x="770" y="250" width="480" height="260" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="795" y="285" fill="#0F172A" font-size="16" font-weight="700" class="font-sans">Open Tasks by Priority</text>
  <g transform="translate(795, 310)">
    <text x="0" y="20" fill="#475467" font-size="13" class="font-body">Critical</text>
    <rect x="70" y="8" width="340" height="14" rx="7" fill="#F1F5F9"/>
    <rect x="70" y="8" width="0" height="14" rx="7" fill="#DC2626"/>
    <text x="420" y="20" fill="#475467" font-size="13" font-weight="700" class="font-body">0</text>

    <text x="0" y="55" fill="#475467" font-size="13" class="font-body">High</text>
    <rect x="70" y="43" width="340" height="14" rx="7" fill="#F1F5F9"/>
    <rect x="70" y="43" width="136" height="14" rx="7" fill="#D97706"/>
    <text x="420" y="55" fill="#475467" font-size="13" font-weight="700" class="font-body">2</text>

    <text x="0" y="90" fill="#475467" font-size="13" class="font-body">Medium</text>
    <rect x="70" y="78" width="340" height="14" rx="7" fill="#F1F5F9"/>
    <rect x="70" y="78" width="136" height="14" rx="7" fill="#2563EB"/>
    <text x="420" y="90" fill="#475467" font-size="13" font-weight="700" class="font-body">2</text>

    <text x="0" y="125" fill="#475467" font-size="13" class="font-body">Low</text>
    <rect x="70" y="113" width="340" height="14" rx="7" fill="#F1F5F9"/>
    <rect x="70" y="113" width="68" height="14" rx="7" fill="#94A3B8"/>
    <text x="420" y="125" fill="#475467" font-size="13" font-weight="700" class="font-body">1</text>
  </g>

  <!-- Activity Timeline Lower Section -->
  <rect x="270" y="530" width="980" height="280" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="295" y="565" fill="#0F172A" font-size="16" font-weight="700" class="font-sans">Recent Shift Handover Activity Timeline</text>
  <g transform="translate(295, 590)">
    <circle cx="10" cy="15" r="5" fill="#2563EB"/>
    <line x1="10" y1="20" x2="10" y2="180" stroke="#E2E8F0" stroke-width="2"/>
    <text x="30" y="18" fill="#0F172A" font-size="13" font-weight="600" class="font-body">Handover drafted: Morning Shift to Evening Shift (3 tasks, 2 incidents)</text>
    <text x="30" y="38" fill="#64748B" font-size="12" class="font-mono">Rahul Mehta • Today 13:50</text>

    <circle cx="10" cy="75" r="5" fill="#2563EB"/>
    <text x="30" y="78" fill="#0F172A" font-size="13" font-weight="600" class="font-body">Incident reported: Fire exit blocked by pallets in Zone C</text>
    <text x="30" y="98" fill="#64748B" font-size="12" class="font-mono">Priya Nair • Today 11:20</text>

    <circle cx="10" cy="135" r="5" fill="#059669"/>
    <text x="30" y="138" fill="#0F172A" font-size="13" font-weight="600" class="font-body">Task completed: Morning dock inspection signed off</text>
    <text x="30" y="158" fill="#64748B" font-size="12" class="font-mono">Rahul Mehta • Today 09:45</text>
  </g>

</svg>