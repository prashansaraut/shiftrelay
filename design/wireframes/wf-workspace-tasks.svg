<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ShiftRelay Wireframe - Task Operations</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
  <rect width="1200" height="800" fill="#0B0F19"/>
  
  <rect x="40" y="40" width="1120" height="720" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/>
  <rect x="40" y="40" width="240" height="720" rx="16" fill="#1F2937"/>
  <text x="70" y="90" fill="#F9FAFB" font-size="18" font-weight="bold" class="font-sans">ShiftRelay</text>
  <text x="80" y="165" fill="#9CA3AF" font-size="14" class="font-sans">Dashboard</text>
  <text x="80" y="215" fill="#9CA3AF" font-size="14" class="font-sans">Handovers</text>
  <rect x="60" y="240" width="200" height="40" rx="8" fill="#2563EB"/>
  <text x="80" y="265" fill="#FFFFFF" font-size="14" font-weight="bold" class="font-sans">Tasks</text>
  <text x="80" y="315" fill="#9CA3AF" font-size="14" class="font-sans">Incidents</text>

  <g transform="translate(320, 60)">
    <text x="0" y="30" fill="#F9FAFB" font-size="24" font-weight="bold" class="font-sans">Operational Task Register</text>
    <text x="0" y="55" fill="#9CA3AF" font-size="14" class="font-sans">All tasks with provenance, shift assignment, and carry-forward count</text>
    
    <!-- Filter bar -->
    <rect x="0" y="80" width="300" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
    <text x="15" y="103" fill="#9CA3AF" font-size="13" class="font-sans">Search by title or ID...</text>
    <rect x="320" y="80" width="120" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
    <text x="335" y="103" fill="#D1D5DB" font-size="13" class="font-sans">All Shifts ▾</text>
    <rect x="460" y="80" width="130" height="36" rx="6" fill="#1F2937" stroke="#374151"/>
    <text x="475" y="103" fill="#D1D5DB" font-size="13" class="font-sans">Open Status ▾</text>
    <rect x="680" y="80" width="130" height="36" rx="6" fill="#2563EB"/>
    <text x="705" y="103" fill="#fff" font-size="13" font-weight="bold" class="font-sans">+ Create Task</text>

    <!-- Table -->
    <rect x="0" y="135" width="810" height="40" rx="6" fill="#1F2937"/>
    <text x="20" y="160" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">ID</text>
    <text x="120" y="160" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">TITLE</text>
    <text x="420" y="160" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">SHIFT</text>
    <text x="540" y="160" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">CARRIED</text>
    <text x="650" y="160" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">STATUS</text>

    <!-- Row 1 -->
    <rect x="0" y="185" width="810" height="55" rx="6" fill="#161E2E" stroke="#374151"/>
    <text x="20" y="218" fill="#60A5FA" font-size="13" class="mono">TSK-101</text>
    <text x="120" y="218" fill="#E5E7EB" font-size="13" font-weight="600" class="font-sans">Calibrate pressure transmitter PT-104</text>
    <text x="420" y="218" fill="#D1D5DB" font-size="13" class="font-sans">Morning</text>
    <rect x="540" y="202" width="40" height="24" rx="4" fill="#374151"/>
    <text x="555" y="218" fill="#E5E7EB" font-size="12" font-weight="bold" class="font-sans">0</text>
    <rect x="650" y="202" width="70" height="24" rx="12" fill="#065F46"/>
    <text x="662" y="218" fill="#6EE7B7" font-size="11" font-weight="bold" class="font-sans">Open</text>

    <!-- Row 2 -->
    <rect x="0" y="250" width="810" height="55" rx="6" fill="#161E2E" stroke="#374151"/>
    <text x="20" y="283" fill="#60A5FA" font-size="13" class="mono">TSK-104</text>
    <text x="120" y="283" fill="#E5E7EB" font-size="13" font-weight="600" class="font-sans">Turbine vibration analysis report</text>
    <text x="420" y="283" fill="#D1D5DB" font-size="13" class="font-sans">Evening</text>
    <rect x="540" y="267" width="40" height="24" rx="4" fill="#991B1B"/>
    <text x="555" y="283" fill="#FCA5A5" font-size="12" font-weight="bold" class="font-sans">2x</text>
    <rect x="650" y="267" width="110" height="24" rx="12" fill="#854D0E"/>
    <text x="660" y="283" fill="#FDE047" font-size="11" font-weight="bold" class="font-sans">Carried Forward</text>
  </g>

</svg>