<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ShiftRelay Wireframe - Handovers Registry</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
  <rect width="1200" height="800" fill="#0B0F19"/>
  
  <rect x="40" y="40" width="1120" height="720" rx="16" fill="#111827" stroke="#374151" stroke-width="2"/>
  <rect x="40" y="40" width="240" height="720" rx="16" fill="#1F2937"/>
  <text x="70" y="90" fill="#F9FAFB" font-size="18" font-weight="bold" class="font-sans">ShiftRelay</text>
  <rect x="60" y="140" width="200" height="40" rx="8" fill="#374151"/>
  <text x="80" y="165" fill="#D1D5DB" font-size="14" class="font-sans">Dashboard</text>
  <rect x="60" y="190" width="200" height="40" rx="8" fill="#2563EB"/>
  <text x="80" y="215" fill="#FFFFFF" font-size="14" font-weight="bold" class="font-sans">Handovers</text>
  <text x="80" y="265" fill="#9CA3AF" font-size="14" class="font-sans">Tasks</text>
  <text x="80" y="315" fill="#9CA3AF" font-size="14" class="font-sans">Incidents</text>
  <text x="80" y="365" fill="#9CA3AF" font-size="14" class="font-sans">Activity Log</text>

  <g transform="translate(320, 60)">
    <text x="0" y="30" fill="#F9FAFB" font-size="24" font-weight="bold" class="font-sans">Handover Protocols</text>
    <text x="0" y="55" fill="#9CA3AF" font-size="14" class="font-sans">Structured operational batons and recorded acknowledgements</text>
    <rect x="650" y="10" width="160" height="40" rx="8" fill="#2563EB"/>
    <text x="680" y="35" fill="#FFFFFF" font-size="14" font-weight="bold" class="font-sans">+ Draft Handover</text>

    <!-- Table header -->
    <rect x="0" y="90" width="810" height="44" rx="8" fill="#1F2937"/>
    <text x="20" y="117" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">HANDOVER ID</text>
    <text x="140" y="117" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">SHIFT ROUTE</text>
    <text x="320" y="117" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">STATUS</text>
    <text x="460" y="117" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">ITEMS ATTACHED</text>
    <text x="640" y="117" fill="#9CA3AF" font-size="12" font-weight="bold" class="font-sans">ACTIONS</text>

    <!-- Row 1 -->
    <rect x="0" y="145" width="810" height="60" rx="8" fill="#161E2E" stroke="#374151"/>
    <text x="20" y="180" fill="#60A5FA" font-size="13" font-weight="bold" class="mono">HO-8241</text>
    <text x="140" y="180" fill="#E5E7EB" font-size="13" class="font-sans">Morning → Evening</text>
    <rect x="320" y="162" width="110" height="26" rx="13" fill="#3730A3"/>
    <text x="335" y="179" fill="#A5B4FC" font-size="11" font-weight="bold" class="font-sans">Acknowledged</text>
    <text x="460" y="180" fill="#D1D5DB" font-size="13" class="font-sans">2 Tasks • 1 Incident</text>
    <rect x="640" y="160" width="80" height="30" rx="6" fill="#374151"/>
    <text x="660" y="180" fill="#E5E7EB" font-size="12" class="font-sans">Inspect</text>

    <!-- Row 2 -->
    <rect x="0" y="215" width="810" height="60" rx="8" fill="#161E2E" stroke="#374151"/>
    <text x="20" y="250" fill="#60A5FA" font-size="13" font-weight="bold" class="mono">HO-8242</text>
    <text x="140" y="250" fill="#E5E7EB" font-size="13" class="font-sans">Evening → Night</text>
    <rect x="320" y="232" width="90" height="26" rx="13" fill="#854D0E"/>
    <text x="335" y="249" fill="#FDE047" font-size="11" font-weight="bold" class="font-sans">Pending</text>
    <text x="460" y="250" fill="#D1D5DB" font-size="13" class="font-sans">3 Tasks • 0 Incidents</text>
    <rect x="640" y="230" width="80" height="30" rx="6" fill="#2563EB"/>
    <text x="655" y="250" fill="#FFFFFF" font-size="12" font-weight="bold" class="font-sans">Sign Off</text>
  </g>

</svg>