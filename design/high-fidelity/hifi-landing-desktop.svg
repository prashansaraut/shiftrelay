<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="920" viewBox="0 0 1280 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>High-Fidelity: Public Landing Desktop</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <rect width="1280" height="920" fill="#F8FAFC"/>
  
  <!-- Top Navigation -->
  <rect x="0" y="0" width="1280" height="74" fill="#FFFFFF" stroke="#E2E8F0"/>
  
  <!-- Logo Mark -->
  <g transform="translate(60, 22)">
    <path d="M7 16C7 11 11 7 16 7c2.6 0 4.9 1.1 6.5 2.9" stroke="#2563EB" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M25 16c0 5-4 9-9 9-2.6 0-4.9-1.1-6.5-2.9" stroke="#059669" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="13.2" y="8" width="5.6" height="16" rx="2.8" transform="rotate(30 16 16)" fill="#D97706"/>
    <text x="36" y="22" fill="#0F172A" font-size="20" font-weight="800" class="font-sans">Shift<tspan fill="#2563EB">Relay</tspan></text>
  </g>

  <!-- Desktop Nav Links -->
  <text x="420" y="42" fill="#64748B" font-size="14" font-weight="600" class="font-body">Problem &amp; Solution</text>
  <text x="580" y="42" fill="#64748B" font-size="14" font-weight="600" class="font-body">How It Works</text>
  <text x="700" y="42" fill="#64748B" font-size="14" font-weight="600" class="font-body">Continuity Engine</text>
  <text x="840" y="42" fill="#64748B" font-size="14" font-weight="600" class="font-body">Features</text>

  <!-- Nav CTAs -->
  <rect x="990" y="18" width="115" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1010" y="42" fill="#0F172A" font-size="13" font-weight="600" class="font-body">Explore Demo</text>

  <rect x="1115" y="18" width="110" height="38" rx="6" fill="#2563EB"/>
  <text x="1128" y="42" fill="#FFFFFF" font-size="13" font-weight="600" class="font-body">Open Workspace</text>

  <!-- Hero Section -->
  <g transform="translate(60, 130)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="260" height="30" rx="15" fill="#EFF6FF" stroke="#DBEAFE"/>
    <circle cx="16" cy="15" r="4" fill="#2563EB"/>
    <text x="28" y="20" fill="#2563EB" font-size="12" font-weight="700" class="font-body">ShiftRelay 2.4 — Shift Continuity System</text>

    <!-- Headline -->
    <text x="0" y="75" fill="#0F172A" font-size="44" font-weight="800" class="font-sans">Never drop the baton</text>
    <text x="0" y="125" fill="#0F172A" font-size="44" font-weight="800" class="font-sans">between shifts.</text>

    <!-- Subtitle -->
    <text x="0" y="170" fill="#64748B" font-size="16" font-weight="400" class="font-body">Every shift connected. Nothing left behind. ShiftRelay turns handover</text>
    <text x="0" y="195" fill="#64748B" font-size="16" font-weight="400" class="font-body">blind spots into verifiable operational continuity with original record</text>
    <text x="0" y="220" fill="#64748B" font-size="16" font-weight="400" class="font-body">preservation, mutual sign-offs, and conflict-safe state transitions.</text>

    <!-- CTAs -->
    <rect x="0" y="260" width="220" height="48" rx="8" fill="#2563EB"/>
    <text x="30" y="290" fill="#FFFFFF" font-size="14" font-weight="700" class="font-body">▶ Explore Interactive Demo</text>

    <rect x="235" y="260" width="165" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="260" y="290" fill="#0F172A" font-size="14" font-weight="700" class="font-body">⊞ Open Workspace</text>

    <!-- Trust Badges -->
    <g transform="translate(0, 340)">
      <text x="0" y="15" fill="#059669" font-size="14" font-weight="700" class="font-body">✓</text>
      <text x="18" y="15" fill="#64748B" font-size="13" font-weight="600" class="font-body">Original Record ID Preservation</text>

      <text x="215" y="15" fill="#059669" font-size="14" font-weight="700" class="font-body">✓</text>
      <text x="233" y="15" fill="#64748B" font-size="13" font-weight="600" class="font-body">Traceable Carry History</text>

      <text x="390" y="15" fill="#059669" font-size="14" font-weight="700" class="font-body">✓</text>
      <text x="408" y="15" fill="#64748B" font-size="13" font-weight="600" class="font-body">Recorded Mutual Sign-offs</text>
    </g>
  </g>

  <!-- Hero Product Preview Mockup Right -->
  <g transform="translate(680, 110)">
    <rect x="0" y="0" width="540" height="410" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 15px 30px rgba(15,23,42,0.08))"/>
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="540" height="38" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="20" cy="19" r="4.5" fill="#CBD5E1"/>
    <circle cx="34" cy="19" r="4.5" fill="#CBD5E1"/>
    <circle cx="48" cy="19" r="4.5" fill="#CBD5E1"/>
    <text x="70" y="23" fill="#64748B" font-size="12" class="font-mono">shiftrelay.app/app/handovers/HO-8241</text>
    <text x="470" y="23" fill="#059669" font-size="11" font-weight="700" class="font-body">● LIVE</text>

    <!-- Handover Header -->
    <g transform="translate(24, 55)">
      <rect x="0" y="0" width="65" height="22" rx="4" fill="#EFF6FF"/>
      <text x="8" y="15" fill="#2563EB" font-size="11" font-weight="700" class="font-mono">HO-8241</text>

      <rect x="330" y="0" width="160" height="22" rx="11" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="342" y="15" fill="#D97706" font-size="11" font-weight="700" class="font-body">Awaiting Acknowledgement</text>

      <text x="0" y="45" fill="#0F172A" font-size="18" font-weight="800" class="font-sans">Morning Shift to Evening Shift</text>
      <text x="0" y="65" fill="#64748B" font-size="12" class="font-body">Outgoing: Rahul Mehta (Supervisor) ➔ Incoming: Sana Khan</text>
    </g>

    <!-- Attached Items Container -->
    <g transform="translate(24, 140)">
      <!-- Incident Hot Card -->
      <rect x="0" y="0" width="492" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#DC2626"/>
      <text x="16" y="23" fill="#0F172A" font-size="13" font-weight="700" class="font-body">IN-2001: Fire exit blocked by pallets in Zone C</text>
      <text x="16" y="42" fill="#64748B" font-size="11" class="font-body">Warehouse Ops • Reported by Priya Nair</text>
      <rect x="420" y="14" width="60" height="22" rx="11" fill="#FEF2F2"/>
      <text x="432" y="29" fill="#DC2626" font-size="10" font-weight="700" class="font-body">Critical</text>

      <!-- Task Card 1 -->
      <rect x="0" y="62" width="492" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="16" y="85" fill="#0F172A" font-size="13" font-weight="700" class="font-body">TK-1001: Inspect conveyor belt 3 in Zone B</text>
      <text x="16" y="104" fill="#64748B" font-size="11" class="font-body">Maintenance • Assigned to Rahul Mehta</text>
      <rect x="400" y="76" width="80" height="22" rx="11" fill="#EFF6FF"/>
      <text x="412" y="91" fill="#2563EB" font-size="10" font-weight="700" class="font-body">In Progress</text>

      <!-- Task Card 2 (Repeat Risk) -->
      <rect x="0" y="124" width="492" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="16" y="147" fill="#0F172A" font-size="13" font-weight="700" class="font-body">TK-1003: Calibrate forklift laser scanner</text>
      <text x="16" y="166" fill="#64748B" font-size="11" class="font-body">Maintenance • Waiting on vendor calibration probe</text>
      <rect x="360" y="138" width="120" height="22" rx="11" fill="#FFFBEB"/>
      <text x="372" y="153" fill="#D97706" font-size="10" font-weight="700" class="font-body">Carried 2x (Repeat)</text>

      <!-- Ack Banner -->
      <rect x="0" y="186" width="492" height="45" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="16" y="213" fill="#059669" font-size="12" font-weight="600" class="font-body">✓ Incoming supervisor review verified (Sana Khan)</text>
      <text x="325" y="213" fill="#059669" font-size="11" font-weight="700" class="font-mono">Continuity Ready</text>
    </g>
  </g>

</svg>