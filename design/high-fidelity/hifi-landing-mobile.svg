<?xml version="1.0" encoding="UTF-8"?>
<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>High-Fidelity: Public Landing Mobile (390px)</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <rect width="390" height="844" fill="#F8FAFC"/>
  
  <!-- Mobile Header -->
  <rect x="0" y="0" width="390" height="64" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g transform="translate(16, 18)">
    <path d="M7 16C7 11 11 7 16 7c2.6 0 4.9 1.1 6.5 2.9" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M25 16c0 5-4 9-9 9-2.6 0-4.9-1.1-6.5-2.9" stroke="#059669" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <rect x="13.2" y="8" width="5.6" height="16" rx="2.8" transform="rotate(30 16 16)" fill="#D97706"/>
    <text x="32" y="20" fill="#0F172A" font-size="18" font-weight="800" class="font-sans">Shift<tspan fill="#2563EB">Relay</tspan></text>
  </g>

  <!-- Hamburger Button -->
  <rect x="334" y="14" width="38" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <line x1="344" y1="24" x2="362" y2="24" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  <line x1="344" y1="32" x2="362" y2="32" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  <line x1="344" y1="40" x2="362" y2="40" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

  <!-- Hero Mobile -->
  <g transform="translate(16, 82)">
    <rect x="0" y="0" width="230" height="26" rx="13" fill="#EFF6FF" stroke="#DBEAFE"/>
    <circle cx="12" cy="13" r="3.5" fill="#2563EB"/>
    <text x="22" y="17" fill="#2563EB" font-size="11" font-weight="700" class="font-body">ShiftRelay 2.4 — Continuity System</text>

    <text x="0" y="58" fill="#0F172A" font-size="28" font-weight="800" class="font-sans">Never drop the</text>
    <text x="0" y="92" fill="#0F172A" font-size="28" font-weight="800" class="font-sans">baton between shifts.</text>

    <text x="0" y="125" fill="#64748B" font-size="13" font-weight="400" class="font-body">Every shift connected. Nothing left behind. ShiftRelay</text>
    <text x="0" y="145" fill="#64748B" font-size="13" font-weight="400" class="font-body">turns handover blind spots into verifiable records.</text>

    <rect x="0" y="175" width="358" height="48" rx="8" fill="#2563EB"/>
    <text x="75" y="205" fill="#FFFFFF" font-size="14" font-weight="700" class="font-body">▶ Explore Interactive Demo</text>

    <rect x="0" y="233" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="110" y="263" fill="#0F172A" font-size="14" font-weight="700" class="font-body">⊞ Open Workspace</text>

    <!-- Mobile Value List -->
    <g transform="translate(0, 305)">
      <text x="0" y="15" fill="#059669" font-size="13" font-weight="700" class="font-body">✓ Original Record ID Preservation</text>
      <text x="0" y="38" fill="#059669" font-size="13" font-weight="700" class="font-body">✓ Traceable Carry-Forward History</text>
      <text x="0" y="61" fill="#059669" font-size="13" font-weight="700" class="font-body">✓ Recorded Mutual Sign-offs</text>
    </g>
  </g>

  <!-- Mobile Mockup Preview Window -->
  <g transform="translate(16, 480)">
    <rect x="0" y="0" width="358" height="320" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 8px 16px rgba(15,23,42,0.06))"/>
    <rect x="0" y="0" width="358" height="32" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="15" cy="16" r="3.5" fill="#CBD5E1"/>
    <circle cx="26" cy="16" r="3.5" fill="#CBD5E1"/>
    <circle cx="37" cy="16" r="3.5" fill="#CBD5E1"/>
    <text x="50" y="19" fill="#64748B" font-size="10" class="font-mono">shiftrelay.app/handovers/HO-8241</text>
    <text x="315" y="19" fill="#059669" font-size="9" font-weight="700" class="font-body">● LIVE</text>

    <!-- Header Inside Card -->
    <g transform="translate(14, 45)">
      <rect x="0" y="0" width="55" height="18" rx="4" fill="#EFF6FF"/>
      <text x="6" y="13" fill="#2563EB" font-size="10" font-weight="700" class="font-mono">HO-8241</text>
      <rect x="180" y="0" width="150" height="18" rx="9" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="190" y="13" fill="#D97706" font-size="9.5" font-weight="700" class="font-body">Awaiting Sign-off</text>

      <text x="0" y="38" fill="#0F172A" font-size="15" font-weight="700" class="font-sans">Morning to Evening Handover</text>
      <text x="0" y="55" fill="#64748B" font-size="11" class="font-body">Rahul Mehta ➔ Sana Khan</text>
    </g>

    <!-- Attached Items on Mobile -->
    <g transform="translate(14, 115)">
      <rect x="0" y="0" width="330" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="0" y="0" width="3" height="42" rx="1.5" fill="#DC2626"/>
      <text x="10" y="18" fill="#0F172A" font-size="11.5" font-weight="700" class="font-body">IN-2001: Fire exit blocked</text>
      <text x="10" y="32" fill="#64748B" font-size="10" class="font-body">Zone C • Priya Nair</text>
      <rect x="270" y="10" width="50" height="18" rx="9" fill="#FEF2F2"/>
      <text x="278" y="22" fill="#DC2626" font-size="9" font-weight="700" class="font-body">Critical</text>

      <rect x="0" y="50" width="330" height="42" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="10" y="68" fill="#0F172A" font-size="11.5" font-weight="700" class="font-body">TK-1003: Calibrate scanner</text>
      <text x="10" y="82" fill="#64748B" font-size="10" class="font-body">Maintenance • Vendor part</text>
      <rect x="235" y="60" width="85" height="18" rx="9" fill="#FFFBEB"/>
      <text x="242" y="72" fill="#D97706" font-size="9" font-weight="700" class="font-body">Carried 2x</text>

      <rect x="0" y="100" width="330" height="34" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="10" y="122" fill="#059669" font-size="10.5" font-weight="600" class="font-body">✓ Sana Khan (Incoming Supervisor) Verified</text>
    </g>
  </g>

</svg>