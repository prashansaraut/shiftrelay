<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>ShiftRelay Hi-Fi - Interactive Demo Experience</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
  <rect width="1280" height="800" fill="#0B0F19"/>
  
  <rect x="0" y="0" width="1280" height="800" fill="#0A0F1D"/>
  <rect x="40" y="30" width="1200" height="740" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="1200" height="70" rx="16" fill="#151C2C"/>
  <g transform="translate(64, 48)">
    <circle cx="16" cy="16" r="16" fill="#2563EB"/>
    <path d="M11 16L15 20L22 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="22" fill="#FFFFFF" font-size="18" font-weight="bold" class="font-sans">ShiftRelay</text>
    <text x="145" y="22" fill="#6B7280" font-size="14" class="font-sans">|</text>
    <text x="160" y="22" fill="#9CA3AF" font-size="14" class="font-sans">Guided Continuity Simulator (In-Memory Safe)</text>
  </g>
  <rect x="1080" y="48" width="130" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="1105" y="71" fill="#94A3B8" font-size="13" font-weight="600" class="font-sans">Exit Demo ✕</text>

  <!-- Progress Bar Steps -->
  <g transform="translate(64, 125)">
    <rect width="1152" height="60" rx="10" fill="#172033" stroke="#1E293B"/>
    <g transform="translate(20, 16)">
      <circle cx="14" cy="14" r="14" fill="#10B981"/><path d="M10 14L13 17L19 11" stroke="#fff" stroke-width="2"/>
      <text x="36" y="19" fill="#10B981" font-size="13" font-weight="bold" class="font-sans">1. Outgoing Shift</text>
    </g>
    <line x1="190" y1="30" x2="230" y2="30" stroke="#10B981" stroke-width="2"/>
    <g transform="translate(250, 16)">
      <circle cx="14" cy="14" r="14" fill="#10B981"/><path d="M10 14L13 17L19 11" stroke="#fff" stroke-width="2"/>
      <text x="36" y="19" fill="#10B981" font-size="13" font-weight="bold" class="font-sans">2. Draft Generated</text>
    </g>
    <line x1="430" y1="30" x2="470" y2="30" stroke="#3B82F6" stroke-width="2"/>
    <g transform="translate(490, 16)">
      <circle cx="14" cy="14" r="14" fill="#EF4444"/><text x="10" y="19" fill="#fff" font-size="12" font-weight="bold" class="font-sans">3</text>
      <text x="36" y="19" fill="#FCA5A5" font-size="13" font-weight="bold" class="font-sans">3. Conflict Test</text>
    </g>
    <line x1="650" y1="30" x2="690" y2="30" stroke="#334155" stroke-width="2"/>
    <g transform="translate(710, 16)">
      <circle cx="14" cy="14" r="14" fill="#334155"/><text x="10" y="19" fill="#94A3B8" font-size="12" font-weight="bold" class="font-sans">4</text>
      <text x="36" y="19" fill="#94A3B8" font-size="13" class="font-sans">4. Sign-Off</text>
    </g>
    <line x1="840" y1="30" x2="880" y2="30" stroke="#334155" stroke-width="2"/>
    <g transform="translate(900, 16)">
      <circle cx="14" cy="14" r="14" fill="#334155"/><text x="10" y="19" fill="#94A3B8" font-size="12" font-weight="bold" class="font-sans">5</text>
      <text x="36" y="19" fill="#94A3B8" font-size="13" class="font-sans">5. Provenance Audit</text>
    </g>
  </g>

  <!-- Left Action Panel -->
  <g transform="translate(64, 210)">
    <rect width="480" height="530" rx="12" fill="#131B2E" stroke="#1E293B"/>
    <rect x="24" y="24" width="130" height="24" rx="12" fill="#3B82F6" fill-opacity="0.15"/>
    <text x="36" y="40" fill="#60A5FA" font-size="11" font-weight="bold" class="font-sans">MILESTONE 03 / 05</text>
    <text x="24" y="80" fill="#FFFFFF" font-size="22" font-weight="bold" class="font-sans">Mid-Flight Conflict Detection</text>
    <text x="24" y="115" fill="#94A3B8" font-size="14" class="font-sans">In real production environments, tasks are dynamic.</text>
    <text x="24" y="138" fill="#94A3B8" font-size="14" class="font-sans">What happens if a supervisor shifts a task to Night Shift</text>
    <text x="24" y="161" fill="#94A3B8" font-size="14" class="font-sans">while the handover is sitting awaiting sign-off?</text>

    <!-- Conflict Card -->
    <rect x="24" y="195" width="432" height="150" rx="10" fill="#2A1418" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="50" cy="225" r="12" fill="#EF4444"/>
    <text x="46" y="230" fill="#fff" font-size="12" font-weight="bold" class="font-sans">!</text>
    <text x="72" y="230" fill="#F87171" font-size="14" font-weight="bold" class="font-sans">Continuity Engine Safe Guard Active</text>
    <text x="40" y="265" fill="#FECACA" font-size="13" class="font-sans">TSK-104 was reassigned to Night Shift by Sarah Vance.</text>
    <text x="40" y="290" fill="#FECACA" font-size="13" class="font-sans">Traditional systems silently overwrite this with the handover's</text>
    <text x="40" y="315" fill="#FECACA" font-size="13" class="font-sans">target shift. ShiftRelay detects and respects modern state.</text>

    <rect x="24" y="380" width="200" height="48" rx="8" fill="#EF4444"/>
    <text x="48" y="410" fill="#FFFFFF" font-size="14" font-weight="bold" class="font-sans">Simulate Conflict</text>
    <rect x="240" y="380" width="216" height="48" rx="8" fill="#2563EB"/>
    <text x="268" y="410" fill="#FFFFFF" font-size="14" font-weight="bold" class="font-sans">Acknowledge Baton →</text>
  </g>

  <!-- Right Visual State -->
  <g transform="translate(568, 210)">
    <rect width="648" height="530" rx="12" fill="#131B2E" stroke="#1E293B"/>
    <text x="28" y="45" fill="#E2E8F0" font-size="16" font-weight="bold" class="font-sans">Handover Payload [HO-8241]</text>
    <rect x="490" y="28" width="130" height="26" rx="13" fill="#854D0E"/>
    <text x="505" y="45" fill="#FDE047" font-size="11" font-weight="bold" class="font-sans">AWAITING REVIEW</text>

    <!-- Inspection cards -->
    <rect x="28" y="70" width="592" height="110" rx="8" fill="#172238" stroke="#1E293B"/>
    <text x="48" y="100" fill="#F8FAFC" font-size="14" font-weight="bold" class="font-sans">Task: TSK-101 — Calibrate Main Gas Flare Igniter</text>
    <text x="48" y="125" fill="#94A3B8" font-size="13" class="font-sans">Original Shift: Morning • Status: Open • Carry Count: 0</text>
    <rect x="48" y="140" width="160" height="22" rx="4" fill="#065F46"/>
    <text x="58" y="155" fill="#6EE7B7" font-size="11" font-weight="bold" class="font-sans">Eligible for Baton Transfer</text>

    <rect x="28" y="195" width="592" height="135" rx="8" fill="#221B27" stroke="#EF4444"/>
    <text x="48" y="225" fill="#FCA5A5" font-size="14" font-weight="bold" class="font-sans">Task: TSK-104 — Turbine Vibration Diagnostics</text>
    <text x="48" y="250" fill="#E2E8F0" font-size="13" class="font-sans">Assigned Shift: SH-NIGHT (Modified 3 mins ago)</text>
    <rect x="48" y="265" width="300" height="24" rx="4" fill="#7F1D1D"/>
    <text x="58" y="281" fill="#FCA5A5" font-size="11" font-weight="bold" class="font-sans">PROTECTED: Will NOT be overwritten by HO-8241</text>
    <text x="48" y="312" fill="#94A3B8" font-size="12" class="mono">Engine Hash: 9d1b-preserve-external-state</text>

    <rect x="28" y="345" width="592" height="120" rx="8" fill="#172238" stroke="#1E293B"/>
    <text x="48" y="375" fill="#F8FAFC" font-size="14" font-weight="bold" class="font-sans">Incident: INC-402 — Valve V-12 Pressure Relief Failure</text>
    <text x="48" y="400" fill="#EF4444" font-size="13" font-weight="bold" class="font-sans">CRITICAL PRIORITY • UNRESOLVED</text>
    <text x="48" y="425" fill="#94A3B8" font-size="13" class="font-sans">Automatically escalated into Evening Shift with full audit trail</text>
  </g>

</svg>