<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>High-Fidelity: Operations Dashboard (1280px)</title>
  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .font-body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
  <rect width="1280" height="900" fill="#F8FAFC"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="900" fill="#0F172A"/>
  <g transform="translate(24, 24)">
    <path d="M7 16C7 11 11 7 16 7c2.6 0 4.9 1.1 6.5 2.9" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M25 16c0 5-4 9-9 9-2.6 0-4.9-1.1-6.5-2.9" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <rect x="13.2" y="8" width="5.6" height="16" rx="2.8" transform="rotate(30 16 16)" fill="#F59E0B"/>
    <text x="32" y="20" fill="#FFFFFF" font-size="18" font-weight="800" class="font-sans">Shift<tspan fill="#3B82F6">Relay</tspan></text>
  </g>

  <!-- Sidebar Links -->
  <g transform="translate(12, 80)">
    <rect x="0" y="0" width="216" height="42" rx="8" fill="#2563EB"/>
    <text x="40" y="26" fill="#FFFFFF" font-size="14" font-weight="600" class="font-sans">Dashboard</text>

    <text x="40" y="68" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Shifts</text>
    <text x="40" y="110" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Handovers</text>
    <text x="40" y="152" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Tasks</text>
    <text x="40" y="194" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Incidents</text>
    <text x="40" y="236" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Activity</text>
    <text x="40" y="278" fill="#94A3B8" font-size="14" font-weight="600" class="font-sans">Settings</text>
  </g>

  <!-- Top Bar -->
  <rect x="240" y="0" width="1040" height="64" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="270" y="14" width="400" height="36" rx="6" fill="#F1F5F9"/>
  <text x="305" y="37" fill="#94A3B8" font-size="13" class="font-body">Search tasks, incidents, handovers, shifts...</text>
  
  <rect x="1100" y="17" width="155" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="1115" y="37" fill="#2563EB" font-size="12" font-weight="700" class="font-body">Operations Manager</text>

  <!-- Main View -->
  <g transform="translate(270, 90)">
    <!-- Header -->
    <text x="0" y="30" fill="#0F172A" font-size="24" font-weight="800" class="font-sans">Operations Dashboard</text>
    <rect x="790" y="5" width="220" height="40" rx="8" fill="#2563EB"/>
    <text x="815" y="30" fill="#FFFFFF" font-size="13" font-weight="700" class="font-body">⇄ Prepare Next Handover</text>

    <!-- 6 Stat Cards -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="38" fill="#0F172A" font-size="28" font-weight="800" class="font-sans">1</text>
      <text x="20" y="64" fill="#64748B" font-size="12" class="font-body">Active Shifts</text>

      <rect x="170" y="0" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="190" y="38" fill="#D97706" font-size="28" font-weight="800" class="font-sans">0</text>
      <text x="190" y="64" fill="#64748B" font-size="12" class="font-body">Awaiting Sign-off</text>

      <rect x="340" y="0" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="360" y="38" fill="#0F172A" font-size="28" font-weight="800" class="font-sans">5</text>
      <text x="360" y="64" fill="#64748B" font-size="12" class="font-body">Open Tasks</text>

      <rect x="510" y="0" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="530" y="38" fill="#DC2626" font-size="28" font-weight="800" class="font-sans">1</text>
      <text x="530" y="64" fill="#64748B" font-size="12" class="font-body">Critical Incidents</text>

      <rect x="680" y="0" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="700" y="38" fill="#D97706" font-size="28" font-weight="800" class="font-sans">1</text>
      <text x="700" y="64" fill="#64748B" font-size="12" class="font-body">Carried Forward</text>

      <rect x="850" y="0" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="870" y="38" fill="#DC2626" font-size="28" font-weight="800" class="font-sans">1</text>
      <text x="870" y="64" fill="#64748B" font-size="12" class="font-body">Overdue Tasks</text>
    </g>

    <!-- Two Mid Cards -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="495" height="260" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="36" fill="#0F172A" font-size="16" font-weight="700" class="font-sans">Continuity Risks (3)</text>
      
      <rect x="24" y="55" width="447" height="42" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
      <text x="40" y="81" fill="#DC2626" font-size="13" font-weight="600" class="font-body">IN-2001: Fire exit blocked by pallets (Critical Incident)</text>

      <rect x="24" y="105" width="447" height="42" rx="6" fill="#FEF2F2" stroke="#FECACA"/>
      <text x="40" y="131" fill="#DC2626" font-size="13" font-weight="600" class="font-body">TK-1003: Calibrate forklift scanner (Overdue by 3h)</text>

      <rect x="24" y="155" width="447" height="42" rx="6" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="40" y="181" fill="#D97706" font-size="13" font-weight="600" class="font-body">TK-1003: Carried forward 2x (Repeat Risk Alert)</text>

      <!-- Priority Bars Card -->
      <rect x="515" y="0" width="495" height="260" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="540" y="36" fill="#0F172A" font-size="16" font-weight="700" class="font-sans">Open Tasks by Priority</text>
      <g transform="translate(540, 65)">
        <text x="0" y="20" fill="#64748B" font-size="13" class="font-body">Critical</text>
        <rect x="65" y="8" width="340" height="14" rx="7" fill="#F1F5F9"/>
        <text x="415" y="20" fill="#0F172A" font-size="13" font-weight="700" class="font-body">0</text>

        <text x="0" y="60" fill="#64748B" font-size="13" class="font-body">High</text>
        <rect x="65" y="48" width="340" height="14" rx="7" fill="#F1F5F9"/>
        <rect x="65" y="48" width="136" height="14" rx="7" fill="#D97706"/>
        <text x="415" y="60" fill="#0F172A" font-size="13" font-weight="700" class="font-body">2</text>

        <text x="0" y="100" fill="#64748B" font-size="13" class="font-body">Medium</text>
        <rect x="65" y="88" width="340" height="14" rx="7" fill="#F1F5F9"/>
        <rect x="65" y="88" width="136" height="14" rx="7" fill="#2563EB"/>
        <text x="415" y="100" fill="#0F172A" font-size="13" font-weight="700" class="font-body">2</text>

        <text x="0" y="140" fill="#64748B" font-size="13" class="font-body">Low</text>
        <rect x="65" y="128" width="340" height="14" rx="7" fill="#F1F5F9"/>
        <rect x="65" y="128" width="68" height="14" rx="7" fill="#94A3B8"/>
        <text x="415" y="140" fill="#0F172A" font-size="13" font-weight="700" class="font-body">1</text>
      </g>
    </g>

    <!-- Bottom Activity Timeline -->
    <rect x="0" y="440" width="1010" height="260" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="24" y="476" fill="#0F172A" font-size="16" font-weight="700" class="font-sans">Recent Shift Handover Activity Timeline</text>
    <g transform="translate(24, 505)">
      <circle cx="10" cy="15" r="5" fill="#2563EB"/>
      <line x1="10" y1="20" x2="10" y2="160" stroke="#E2E8F0" stroke-width="2"/>
      <text x="28" y="19" fill="#0F172A" font-size="13" font-weight="600" class="font-body">Handover drafted: Morning Shift to Evening Shift (3 tasks, 2 incidents)</text>
      <text x="28" y="38" fill="#64748B" font-size="12" class="font-mono">Rahul Mehta • Today 13:50</text>

      <circle cx="10" cy="75" r="5" fill="#2563EB"/>
      <text x="28" y="79" fill="#0F172A" font-size="13" font-weight="600" class="font-body">Incident reported: Fire exit blocked by pallets in Zone C</text>
      <text x="28" y="98" fill="#64748B" font-size="12" class="font-mono">Priya Nair • Today 11:20</text>

      <circle cx="10" cy="135" r="5" fill="#059669"/>
      <text x="28" y="139" fill="#0F172A" font-size="13" font-weight="600" class="font-body">Task completed: Morning dock inspection signed off</text>
      <text x="28" y="158" fill="#64748B" font-size="12" class="font-mono">Rahul Mehta • Today 09:45</text>
    </g>
  </g>

</svg>